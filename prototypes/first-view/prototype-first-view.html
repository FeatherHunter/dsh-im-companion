<style>

  .promo a b { font-weight:600; } .promo a span { color:var(--mut); font-size:12px; flex:1; } .promo a i { color:var(--acc); font-style:normal; }

    '<div class="main"><div class="name" title="' + a.n + '">' + a.n + '</div>' +
    '<div class="chips">' + a.ch.map(x=>'<span class="chip"><span class="dot"></span>'+chipName(x)+'</span>').join('') + '</div>' +
    '<div class="ws ' + c.wsCls + '" title="' + wsTitle + '">' + (V === 'C' ? S.bound(a.n) : (S.wsPre + a.ws)) + '</div></div>' +
    '<div class="actions"><span class="st"><span class="dot"></span>' + S.online + '</span>' +
    '<button class="btn join" title="' + S.joinTitle + '" aria-label="' + S.joinTitle + '">' + S.join + '</button>' +
    '<button class="btn ' + c.detail + '" title="' + S.detailTitle + '" aria-label="' + S.detailTitle + '">' + S.detail + '</button>' +
    '<button class="more" title="' + S.more + '" aria-label="' + S.more + '">···</button></div>';
  row.addEventListener('click', (e) => { if (e.target.closest('button')) return; row.classList.toggle('tap'); });
  list.appendChild(row);
});
document.querySelectorAll('.bar a').forEach(a => { if (a.getAttribute('href').includes('variant='+V)) { a.style.borderColor = 'var(--acc)'; a.style.color = 'var(--acc)'; a.style.fontWeight = '700'; } });
const mark = () => { document.getElementById('tL').classList.toggle('on', theme==='light'); document.getElementById('tD').classList.toggle('on', theme!=='light'); };
mark();
function setTheme(t) { theme = t; document.documentElement.dataset.theme = t === 'light' ? 'light' : ''; history.replaceState(null, '', qs(V_now)); mark(); }
function setLang(l) { location.search = '?' + new URLSearchParams({ variant: V_now, theme, lang: l, promo }).toString(); }
function setPromo(p) { location.search = '?' + new URLSearchParams({ variant: V_now, theme, lang, promo: p }).toString(); }
document.getElementById('p0').onclick = () => setPromo('0');
document.getElementById('p1').onclick = () => setPromo('1');
document.getElementById('p2').onclick = () => setPromo('2');
const pmark = () => { ['0','1','2'].forEach(n => document.getElementById('p'+n).classList.toggle('on', promo===n)); }; pmark();
const starEl = document.getElementById('star'); starEl.setAttribute('aria-label', PS.star); starEl.setAttribute('title', PS.star);
if (P < 1) starEl.style.display = 'none';
if (P >= 2) { const pc = document.getElementById('promoCard'); pc.style.display = ''; document.getElementById('promoT').textContent = PS.promoT;
  document.getElementById('promoList').innerHTML =
    '<a target="_blank" rel="noopener" href="https://github.com/FeatherHunter/dsh-mattpocock-skills-deck"><b>dsh-mattpocock-skills-deck</b><span>' + PS.deckD + '</span><i>›</i></a>' +
    '<a target="_blank" rel="noopener" href="https://github.com/FeatherHunter/dsh-opencode-palette"><b>dsh-opencode-palette</b><span>' + PS.palD + '</span><i>›</i></a>'; }
document.getElementById('gCn').onclick = () => setLang('cn');
document.getElementById('gEn').onclick = () => setLang('en');
const gmark = () => { document.getElementById('gCn').classList.toggle('on', lang==='cn'); document.getElementById('gEn').classList.toggle('on', lang!=='cn'); }; gmark();
document.getElementById('tL').onclick = () => setTheme('light');
document.getElementById('tD').onclick = () => setTheme('dark');
document.querySelectorAll('.bar a').forEach(a => { const u = new URL(a.getAttribute('href'), location.href); u.searchParams.set('theme', theme); u.searchParams.set('lang', lang); u.searchParams.set('promo', promo); a.setAttribute('href', '?' + u.searchParams.toString()); });
document.getElementById('curlabel').innerHTML = '当前：<code>' + V_now + '（' + c.name + '）</code> · 主题 <code>' + theme + '</code> · 语言 <code>' + lang + '</code> · 推广 <code>P' + promo + '</code>';
document.getElementById('statepanel').innerHTML =
  '<b>当前状态</b>：variant=<code>' + V_now + '</code> theme=<code>' + theme + '</code> lang=<code>' + lang + '</code>（演示DSH语言切换：本面文案整体替换，实现侧以i18n key给中英两套内容，不做切换器）<br>' +
  '锁定项（三变体一致）：悬停统一B · 全绿在线不动 · 只动视觉文案不动行为<br>' +
  '已定（D赢家）：标题不独占行 · 路径A单行省略 · X头像D去前缀Ji-Sh-Su-Wa+柔色（默认配色仅兜底，用户自设头像后即替换）· 详情ghost · 中文名助理 · 大标题中文大+英文小副标。<br>' +
  '引流（新增议题，待拍板放哪+文案）：P0无（对照）· P1工具栏星标（跳 companion 仓库点 Star）· P2星标+底部关联卡（skills-deck / opencode-palette，新开页）。';
const rt = document.getElementById('retry'); if (rt) { rt.textContent = S.retry; rt.onclick = () => { const t0 = S.retry; rt.textContent = '…'; setTimeout(() => { rt.textContent = t0; }, 600); }; }
</script>
</body>
