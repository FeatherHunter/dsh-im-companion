<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T4 原型 · 窄面板 Studio（popover 交互版）</title>
<style>
:root{
  --bg:#EEF0F4; --panel:#fff; --panel-2:#F7F8FA; --panel-3:#EFF1F5;
  --ink:#101828; --ink-2:#475467; --ink-3:#98A2B3;
  --line:rgba(16,24,40,.10); --line-soft:rgba(16,24,40,.06);
  --accent:#0D9488; --accent-deep:#0F766E; --accent-soft:rgba(13,148,136,.11);
  --warn:#92400E; --warn-soft:rgba(146,64,14,.11); --bad:#B42318; --bad-soft:rgba(180,35,24,.10);
  --neutral:rgba(71,84,103,.10);
  --r:10px; --r-lg:14px; --sh:0 1px 2px rgba(16,24,40,.05);
  --sh-pop:0 0 0 1px rgba(16,24,40,.04),0 2px 4px rgba(16,24,40,.06),0 22px 52px -18px rgba(16,24,40,.5);
  --sh-2:0 18px 40px -18px rgba(16,24,40,.28);
  --ring:0 0 0 3px rgba(13,148,136,.22);
  --t-fast:120ms; --t:160ms; --t-med:220ms;
  --ease:cubic-bezier(.2,.7,.2,1); --spring:cubic-bezier(.34,1.36,.4,1);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
#popHost,[id$="Host"]{max-width:100vw}
body{margin:0;padding:16px 12px 74px;background:var(--bg);color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.app{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.i{width:15px;height:15px;display:block;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ chrome ============ */
.chrome{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap}
.proto{flex:none;font-size:10.5px;font-weight:650;letter-spacing:.06em;color:var(--ink-3);border:1px dashed var(--line);border-radius:999px;padding:3px 9px}
.chrome .note{font-size:11.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis}
.chrome .spacer{flex:1}
.cbtn{flex:none;font:inherit;font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:8px;height:30px;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all var(--t) var(--ease)}
.cbtn:hover{background:var(--panel-2);color:var(--ink)}
.cbtn:active{transform:scale(.97)}

/* ============ frame ============ */
.frame{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;height:clamp(420px,calc(100vh - 126px),680px)}
.fhead{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line-soft);flex:none}
.fhead .ttl{min-width:0;flex:1}
.fhead .ttl b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .ttl small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:9px;color:var(--ink-2);cursor:pointer;transition:all var(--t) var(--ease);flex:none}
.ibtn:hover{background:var(--panel-3);color:var(--ink)}
.ibtn:active{transform:scale(.94)}
.ibtn.solid{background:var(--accent);color:#fff}
.ibtn.solid:hover{background:var(--accent-deep)}
.ibtn[disabled]{opacity:.4;cursor:not-allowed}
.back{width:32px;height:32px;display:grid;place-items:center;background:var(--panel-3);border:0;border-radius:9px;color:var(--ink-2);cursor:pointer;transition:all var(--t) var(--ease);flex:none}
.back:hover{background:#E4E7EC;color:var(--ink)}
.back:active{transform:scale(.94)}

/* ============ liquid tab (面包屑即液签) ============ */
.crumbs{position:relative;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-soft);flex:none;background:var(--panel-2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{font:inherit;font-size:11.5px;display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid transparent;flex:none;
  border-radius:999px;padding:3px 9px;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:color var(--t) var(--ease);position:relative;z-index:1}
.crumb:hover{color:var(--ink-2)}
.crumb[aria-current="true"]{color:var(--ink);font-weight:650}
.crumb.ghost{opacity:.5;cursor:default;pointer-events:none}
.crumb .lv{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--ink-3)}
.crumb b{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.csplit{color:var(--ink-3);font-size:11px;flex:none;opacity:.8}
.tablk{position:absolute;left:0;top:6px;bottom:6px;border-radius:999px;background:#fff;border:1px solid rgba(16,24,40,.16);box-shadow:0 1px 3px rgba(16,24,40,.10);
  transition:transform 300ms var(--spring),width 300ms var(--spring);pointer-events:none}

/* ============ search + suggestions ============ */
.fsearch{position:relative;margin:10px 12px 0;flex:none}
.fsearch .box{display:flex;align-items:center;gap:7px;padding:0 10px;height:34px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;transition:all var(--t) var(--ease)}
.fsearch .box:focus-within{background:#fff;border-color:rgba(13,148,136,.45);box-shadow:var(--ring)}
.fsearch .box .i{color:var(--ink-3)}
.fsearch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--ink)}
.fsearch input::placeholder{color:var(--ink-3)}
.sugg{position:absolute;left:0;right:0;top:38px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-pop);
  padding:4px;max-height:210px;overflow:auto;animation:popIn var(--t-med) var(--spring);transform-origin:50% 0}
.sugg button{font:inherit;font-size:12.5px;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 9px;cursor:pointer;color:var(--ink)}
.sugg button:hover,.sugg button.hl{background:var(--panel-3)}
.sugg mark{background:rgba(13,148,136,.16);color:var(--accent-deep);border-radius:3px;padding:0 2px}
.sugg .kind{font-size:10.5px;color:var(--ink-3);margin-left:auto}

/* ============ list ============ */
.fbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.fbody::-webkit-scrollbar{width:8px}
.fbody::-webkit-scrollbar-thumb{background:rgba(16,24,40,.14);border-radius:8px}
.row{position:relative;display:grid;grid-template-columns:36px 1fr auto;gap:13px;align-items:center;width:100%;text-align:left;font:inherit;
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 10px;cursor:pointer;
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform var(--t-fast) var(--ease),opacity var(--t) var(--ease);min-height:56px}
.row:hover{border-color:var(--line);box-shadow:var(--sh)}
.row:active{transform:scale(.994)}
.row.on{border-color:rgba(13,148,136,.42);background:#FBFEFD;box-shadow:var(--sh)}
.row.anchor{box-shadow:var(--ring);border-color:rgba(13,148,136,.5)}
.row.leaving{opacity:0;transform:translateX(14px) scale(.97)}
.row.entering{animation:rowIn var(--t-med) var(--spring)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.row .txt{min-width:0;overflow:hidden}
.row .nm{display:flex;align-items:baseline;gap:7px;min-width:0;overflow:hidden}
.row .nm .online,.row .nm .pill{align-self:center}
.row .nm b{font-size:13.5px;font-weight:620;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-right:1px}
.row .sub{display:block;margin-top:5px;font-size:11.5px;line-height:1.4;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names{display:block;margin-top:4px;font-size:11px;line-height:1.45;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .acts2{display:flex;align-items:center;gap:5px;flex:none;padding-left:2px}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:650;font-size:14px;flex:none}
.av.round{border-radius:50%}
.av.sm{width:30px;height:30px;font-size:12.5px;border-radius:9px}
.pill{font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 7px;white-space:nowrap;flex:none}
.pill.ok{color:var(--accent-deep);background:var(--accent-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.dim{color:var(--ink-2);background:var(--neutral)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:#12B0A0;box-shadow:0 0 0 3px rgba(18,176,160,.16)}
.dot.off{background:#CBD5E1}
.dot.live{animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(18,176,160,.35)}50%{box-shadow:0 0 0 5px rgba(18,176,160,0)}}
.online{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:2px 7px;white-space:nowrap;flex:none}
.online.off{color:var(--ink-2);background:var(--neutral);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:600}

/* ============ row action buttons + tooltip ============ */
.ract{font:inherit;font-size:11.5px;height:26px;padding:0 9px;display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
  border-radius:7px;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:all var(--t) var(--ease);flex:none;position:relative}
.ract:hover{background:var(--panel-3);color:var(--ink)}
.ract:active{transform:scale(.94)}
.ract.connect{border-color:rgba(13,148,136,.4);background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.ract.icon{width:26px;padding:0;justify-content:center}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(3px) scale(.96);
  background:#101828;color:#fff;font-size:11px;font-weight:500;line-height:1;padding:6px 8px;border-radius:7px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease),transform var(--t) var(--spring);z-index:80}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
@media (max-width:470px){.hide-narrow{display:none}}

/* ============ detail (3D 视差容器) ============ */
.detail{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel-2);padding:12px;display:flex;flex-direction:column;gap:10px;
  transform-style:preserve-3d;transition:transform var(--t-med) var(--ease),box-shadow var(--t-med) var(--ease);will-change:transform}
.detail.tilt{box-shadow:var(--sh)}
.dhead{display:flex;align-items:center;gap:10px;min-width:0;transform:translateZ(14px)}
.dhead .txt{min-width:0;flex:1}
.dhead b{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;min-width:0;transform:translateZ(8px)}
.mchip{font-size:11px;color:var(--ink-2);background:#fff;border:1px solid var(--line-soft);border-radius:7px;padding:4px 8px;display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0}
.steps3{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);flex-wrap:wrap}
.steps3 i{display:block;width:12px;height:1px;background:var(--line);flex:none}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px;transform:translateZ(6px)}
.acts.danger{margin-top:6px;padding-top:14px;border-top:1px dashed rgba(16,24,40,.14)}
.abtn{font:inherit;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:33px;padding:0 10px;background:#fff;
  border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;transition:all var(--t) var(--ease)}
.abtn:hover{background:var(--panel-3)}
.abtn:active{transform:scale(.96)}
.abtn.go{border-color:rgba(13,148,136,.35);background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.abtn.danger{color:var(--bad);border-color:rgba(180,35,24,.3);background:var(--bad-soft)}
.abtn[disabled]{opacity:.45;cursor:not-allowed}
.kv{display:grid;grid-template-columns:84px 1fr;gap:7px 10px;font-size:12px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}

/* ============ footer ============ */
.ffoot{flex:none;padding:10px 12px;border-top:1px solid var(--line-soft);background:var(--panel);display:flex;gap:8px}
.pbtn{position:relative;overflow:hidden;flex:1;font:inherit;font-size:13px;font-weight:600;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--accent);color:#fff;border:1px solid transparent;border-radius:9px;cursor:pointer;transition:transform var(--t-fast) var(--ease),background var(--t) var(--ease),box-shadow var(--t) var(--ease);
  box-shadow:0 1px 2px rgba(13,148,136,.3);will-change:transform}
.pbtn:hover{background:var(--accent-deep)}
.pbtn:active{transform:scale(.975)}
.pbtn.ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none}
.pbtn.ghost:hover{background:var(--panel-3)}
.pbtn[disabled]{opacity:.5;cursor:not-allowed}

/* ============ empty / skeleton / spinner / progress ============ */
.empty{padding:34px 18px;text-align:center;color:var(--ink-3)}
.empty .eic{width:40px;height:40px;margin:0 auto 10px;border-radius:13px;background:var(--panel-3);display:grid;place-items:center}
.empty b{display:block;color:var(--ink-2);font-size:13px;margin-bottom:3px}
.empty p{margin:0;font-size:11.5px;line-height:1.5}
.sk{border-radius:9px;background:linear-gradient(90deg,#EFF1F5 0%,#E4E8EF 50%,#EFF1F5 100%);background-size:200% 100%;animation:sk 1.15s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.skrow{border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 10px;display:grid;grid-template-columns:36px 1fr 60px;gap:10px;align-items:center;min-height:56px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(13,148,136,.25);border-top-color:var(--accent);animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:3px;border-radius:2px;background:var(--panel-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width 280ms var(--ease)}

/* ============ popover / dropdown / popconfirm ============ */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(16,24,40,.30);backdrop-filter:blur(1.5px);animation:fade var(--t) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{position:fixed;z-index:71;max-width:calc(100vw - 20px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-pop);
  transform-origin:var(--ox,50%) var(--oy,0%);animation:popIn var(--t-med) var(--spring);max-height:min(70vh,520px);display:flex;flex-direction:column;
  cursor:grab}
.pop.dragging{cursor:grabbing;animation:none;transition:none}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
.pop.closing{animation:popOut 130ms var(--ease) forwards}
@keyframes popOut{to{opacity:0;transform:scale(.96) translateY(-4px)}}
.pop .arrow{position:absolute;top:-6px;width:12px;height:12px;background:#fff;border-left:1px solid rgba(16,24,40,.14);border-top:1px solid rgba(16,24,40,.14);transform:rotate(45deg);border-radius:2px}
.pop .arrow.b{top:auto;bottom:-6px;border-left:0;border-top:0;border-right:1px solid rgba(16,24,40,.14);border-bottom:1px solid rgba(16,24,40,.14)}
.ppo{padding:13px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
.ptitle{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:7px;color:var(--ink)}
.ptitle .i{color:var(--accent-deep)}
.pfoot{display:flex;justify-content:flex-end;gap:7px;padding:10px 12px;border-top:1px solid var(--line-soft);background:var(--panel-2);flex:none}
.pbtn-s{font:inherit;font-size:12.5px;font-weight:600;height:32px;padding:0 13px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);transition:all var(--t) var(--ease)}
.pbtn-s:hover{background:var(--panel-3)}
.pbtn-s:active{transform:scale(.96)}
.pbtn-s.go{background:var(--accent);border-color:transparent;color:#fff}
.pbtn-s.go:hover{background:var(--accent-deep)}
.pbtn-s.deny{background:var(--bad);border-color:transparent;color:#fff}
.pbtn-s[disabled]{opacity:.5;cursor:not-allowed}
.menu{display:flex;flex-direction:column;gap:2px;padding:5px;min-width:168px;max-width:calc(100vw - 24px)}
.menu button{font:inherit;font-size:12.5px;display:flex;align-items:center;gap:9px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--ink);cursor:pointer;transition:background var(--t-fast) var(--ease)}
.menu button:hover,.menu button.hl{background:var(--panel-3)}
.menu button.danger{color:var(--bad)}
.menu button .i{color:var(--ink-3)}
.menu button.danger .i{color:var(--bad)}
.menu .sep{height:1px;background:var(--line-soft);margin:4px 6px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
.fld>span{font-weight:600;color:var(--ink);font-size:12.5px}
.fld input,.fld select{font:inherit;font-size:13px;height:36px;padding:0 10px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;transition:all var(--t) var(--ease)}
.fld input:focus,.fld select:focus{outline:0;border-color:rgba(13,148,136,.5);box-shadow:var(--ring)}
.fhint{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.seg2{position:relative;display:flex;background:var(--panel-3);border-radius:9px;padding:3px;gap:2px}
.seg2 button{position:relative;z-index:1;font:inherit;font-size:12.5px;flex:1;height:28px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer;transition:color var(--t) var(--ease)}
.seg2 button[aria-selected="true"]{color:var(--ink);font-weight:600}
.seg2 .ind{position:absolute;top:3px;bottom:3px;border-radius:7px;background:#fff;box-shadow:var(--sh);transition:transform 280ms var(--spring),width 280ms var(--spring)}
.opts{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto}
.opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font:inherit;font-size:12.5px;background:#fff;border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--ink);transition:all var(--t) var(--ease)}
.opt:hover{background:var(--panel-2);border-color:var(--line)}
.opt[aria-selected="true"]{border-color:rgba(13,148,136,.5);background:var(--accent-soft);box-shadow:var(--ring)}
.opt .oi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel-3);flex:none;font-size:11px;font-weight:650}
.opt .ot{min-width:0;flex:1}
.opt .ot b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ot small{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;font-weight:650;font-size:14px;transition:transform var(--t) var(--spring),box-shadow var(--t) var(--ease)}
.swatches button:hover{transform:translateY(-2px) scale(1.04)}
.swatches button[aria-pressed="true"]{box-shadow:var(--ring);border-color:var(--accent)}

/* ============ toast ============ */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,calc(100vw - 24px))}
.toast{pointer-events:auto;width:100%;background:#101828;color:#fff;border-radius:11px;padding:10px 12px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.5);animation:toastIn var(--t-med) var(--spring);cursor:grab;overflow:hidden;position:relative}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut 160ms var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}
.toast.ok .ti{color:#5EEAD4}
.toast.bad .ti{color:#FCA5A5}
.toast .ti{margin-top:1px;flex:none}
.toast .tx{min-width:0;flex:1}
.toast .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.18)}
.toast .prog i{display:block;height:100%;background:#5EEAD4;width:100%;transform-origin:left;transition:transform linear}

/* ============ modal (走查 / 状态) ============ */
.modal{position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade var(--t) var(--ease)}
.mbox{width:100%;max-width:460px;max-height:min(78vh,620px);background:#fff;border-radius:16px;box-shadow:var(--sh-pop);display:flex;flex-direction:column;overflow:hidden;animation:popIn var(--t-med) var(--spring)}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-soft);flex:none}
.mhead b{font-size:13.5px}
.mhead .spacer{flex:1}
.mbody{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
.steplist{display:flex;flex-direction:column;gap:6px}
.steplist button{font:inherit;font-size:12.5px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;color:var(--ink);min-height:42px;transition:all var(--t) var(--ease)}
.steplist button:hover{border-color:rgba(13,148,136,.4);background:var(--accent-soft)}
.steplist button[aria-pressed="true"]{border-color:rgba(13,148,136,.45);background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.json{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;color:var(--ink-2);background:var(--panel-3);border-radius:9px;padding:10px;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.diff{font-size:12px;color:var(--ink-2);background:var(--accent-soft);border-radius:9px;padding:9px 10px;line-height:1.5}

/* ============ dock ============ */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:40;display:flex;align-items:center;gap:3px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:5px;
  box-shadow:var(--sh-2);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock .lead{font-size:11px;color:var(--ink-3);padding:0 4px 0 7px;white-space:nowrap}
.dock a,.dock button{font:inherit;font-size:12px;color:var(--ink-2);background:none;border:0;border-radius:999px;padding:6px 11px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all var(--t) var(--ease)}
.dock a:hover,.dock button:hover{background:var(--panel-3);color:var(--ink)}
.dock a.on{background:var(--accent);color:#fff;font-weight:600}
.dock .div{width:1px;height:16px;background:var(--line);margin:0 3px}
@media (max-width:470px){.chrome .note{display:none}.cbtn span{display:none}.cbtn{padding:0 9px}}
@media (max-width:420px){.frame{height:clamp(400px,68vh,600px)}.fhead .ttl b{font-size:14px}.fhead{padding:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.kv{grid-template-columns:82px minmax(0,1fr);gap:9px 10px}
.ppo{padding:14px 15px;gap:12px}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.chain span{color:var(--ink-3);background:#fff;border:1px solid var(--line-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.chain span.on{color:var(--accent-deep);background:var(--accent-soft);border-color:rgba(13,148,136,.3);font-weight:650}
.chain i{width:10px;height:1px;background:var(--line);display:block;flex:none}
.botblock{border-top:1px solid var(--line-soft);padding-top:11px;margin-top:2px}
.ptitle+.ptitle{margin-top:2px}
.crumb.next{border:1px dashed rgba(16,24,40,.20);color:var(--ink-2);background:#fff}
.crumb.next:hover{background:var(--accent-soft);border-color:rgba(13,148,136,.5);color:var(--accent-deep);border-style:solid}
.crumb.next .crumbgo{width:12px;height:12px;opacity:.65}
.crumb.next:hover .crumbgo{opacity:1}
.crumb.off{opacity:.42;cursor:not-allowed;border-style:dotted}
.crumb.next b{max-width:96px}
</style>

function fl(id){ return S.flashId===id ? " on" : ""; }
function crumbBtn(level,label,current,next,off){
  var cls="crumb"+(current?" cur":"")+(next?" next":"")+(off?" off":"");
  var attrs = current ? " aria-current=\"true\"" : (" data-goto=\""+level+"\""+(off?" aria-disabled=\"true\"" : ""));
  return "<button class=\""+cls+"\""+attrs+"><span class=\"lv\">"+level+"</span><b>"+esc(label)+"</b>"
    + (next && !off ? "<svg class=\"i crumbgo\"><use href=\"#i-chev\"/></svg>" : "")+"</button>";
}
function focusedHomeId(){ return (S.level==="L1" && S.focusId) ? S.focusId : S.selHome; }
function focusedAsstId(){
  if(S.level==="L2") return S.focusId || S.selAsst;
  if(S.level==="L1"){ var f=S.assistants.filter(function(a){ return a.homeId===focusedHomeId(); })[0]; return f?f.id:null; }
  return S.selAsst;
}
function renderCrumbs(){
  var h=homeById(S.selHome), a=asstById(S.selAsst), out=[];
  if(S.level==="L1"){
    var fh=homeById(focusedHomeId());
    var fa=focusedAsstId()?asstById(focusedAsstId()):null;
    out.push(crumbBtn("L1","家",true));
    out.push("<span class=\"csplit\">›</span>");
    out.push(crumbBtn("L2", fh?("助理 · "+homeName(fh)):"助理", false, true, !fh));
    out.push("<span class=\"csplit\">›</span>");
    out.push(crumbBtn("L3", fa?("机器人 · "+asstName(fa)):"机器人", false, true, !fa));
  } else if(S.level==="L2"){
    var fa2=focusedAsstId()?asstById(focusedAsstId()):null;
    out.push(crumbBtn("L1","家",false));
    out.push("<span class=\"csplit\">›</span>");
    out.push(crumbBtn("L2", h?homeName(h):"", true));
    out.push("<span class=\"csplit\">›</span>");
    out.push(crumbBtn("L3", fa2?("机器人 · "+asstName(fa2)):"机器人", false, true, !fa2));
  } else {
    out.push(crumbBtn("L1","家",false));
    out.push("<span class=\"csplit\">›</span>");
    out.push(crumbBtn("L2", h?homeName(h):"", S.level==="L2"));
    if(S.level==="L3"){
      out.push("<span class=\"csplit\">›</span>");
      out.push(crumbBtn("L3", a?asstName(a):"", true));
    }
  }
  crumbsEl.innerHTML = "<span class=\"tablk\" id=\"tablk\" hidden></span>" + out.join("");
  tablk=document.getElementById("tablk");
}
function slideTab(instant){
  var cur=crumbsEl.querySelector(".crumb[aria-current=\"true\"]");
  if(!cur){ tablk.hidden=true; return; }
  var cr=crumbsEl.getBoundingClientRect(), r=cur.getBoundingClientRect();
  tablk.hidden=false;
  if(instant) tablk.style.transition="none";
  tablk.style.width=r.width+"px";
  tablk.style.transform="translateX("+(r.left-cr.left+crumbsEl.scrollLeft)+"px)";
  if(instant) requestAnimationFrame(function(){ tablk.style.transition=""; });
  if(r.right > cr.right) crumbsEl.scrollLeft += Math.ceil(r.right - cr.right + 6);
  else if(r.left < cr.left) crumbsEl.scrollLeft -= Math.ceil(cr.left - r.left + 6);
}

    + "<span class=\"sk\" style=\"width:56px;height:22px;border-radius:999px\"></span></div>";

function rowsHomes(){

  });

  return hs.map(function(h){
    var d=homeName(h), n=S.assistants.filter(function(a){ return a.homeId===h.id; }).length;
    var namesLine = n ? ("助理："+S.assistants.filter(function(a){ return a.homeId===h.id; }).map(function(a){ return esc(asstName(a)); }).join("、")) : "还没有助理";

function flipCapture(){
  var m={};
  var els=fbody.querySelectorAll("[data-id]");
  for(var i=0;i<els.length;i++){ m[els[i].getAttribute("data-id")]=els[i].getBoundingClientRect().top; }
  return m;
}
function flipPlay(prev){
  if(!prev) return;
  var els=fbody.querySelectorAll("[data-id]");
  for(var i=0;i<els.length;i++){
    var el=els[i], id=el.getAttribute("data-id"), p=prev[id];
    if(p===undefined) { el.classList.add("entering"); continue; }
    var d=p-el.getBoundingClientRect().top;
    if(!d) continue;
    el.style.transition="none"; el.style.transform="translateY("+d+"px)";
    (function(node){ requestAnimationFrame(function(){
      node.style.transition="transform 280ms cubic-bezier(.34,1.36,.4,1)";
      node.style.transform="";
    }); })(el);
  }
}
function render(prev){
  var h=homeById(S.selHome), a=asstById(S.selAsst);
  backBtn.hidden=(S.level==="L1"); searchWrap.hidden=(S.level==="L3");
  if(S.loading){
    fTitle.textContent="家"; fSub.textContent="读取中…";
    fbody.innerHTML=skeleton(); ffoot.innerHTML=""; crumbsEl.innerHTML="";
    return;
  }
  if(S.level==="L1"){
    fTitle.textContent="家"; fSub.textContent=S.homes.length+" 个 · 每个家对应一个工作区";
    fIcon.innerHTML="<svg class=\"i\"><use href=\"#i-home\"/></svg>"; fbody.innerHTML=rowsHomes();
  } else if(S.level==="L2"){
    var n=h?S.assistants.filter(function(x){ return x.homeId===h.id; }).length:0;
    fTitle.textContent=h?homeName(h):""; fSub.textContent=h?(homeFrom(h)+" · "+n+" 位助理"):"";
    fIcon.innerHTML="<svg class=\"i\"><use href=\"#i-home\"/></svg>"; fbody.innerHTML=rowsAsst();
  } else {
    fTitle.textContent=a?asstName(a):""; fSub.textContent=a?(asstFrom(a)+" · 助理详情"):"";
    fIcon.innerHTML="<svg class=\"i\"><use href=\"#i-person\"/></svg>"; fbody.innerHTML=viewAsst();
  }
  fMore.hidden=(S.level!=="L2"); fAdd.hidden=(S.level==="L3");
  renderCrumbs(); renderFoot(); slideTab(S._first!==false); S._first=false; flipPlay(prev); bindTilt();
}
function touch(msg){ S.lastDiff=msg; render(); }
function crumbGo(level){
  if(level==="L1"){ go("L1"); return; }
  if(level==="L2"){
    if(S.level==="L1"){ S.selHome = focusedHomeId(); if(!S.selHome){ toast("先新建一个家","bad"); return; } }
    go("L2"); return;
  }
  if(level==="L3"){
    if(S.level==="L1"){ S.selHome = focusedHomeId(); }
    var aid = focusedAsstId();
    if(!aid){ toast("这个家还没有助理，先新建一位","bad"); return; }
    S.selAsst = aid; go("L3"); return;
  }
}
function setFocus(id){
  if(S.focusId===id) return;
  S.focusId=id;
  renderCrumbs(); slideTab(true);
}
function go(level,id){
  S.focusId=null;
  var prev=flipCapture();
  if(level==="L1"){ S.level="L1"; }
  else if(level==="L2"){ if(id) S.selHome=id; S.level="L2";
    var f=S.assistants.filter(function(x){ return x.homeId===S.selHome; })[0]; if(f) S.selAsst=f.id; }
  else if(level==="L3"){ if(id) S.selAsst=id; var a=asstById(S.selAsst); if(a) S.selHome=a.homeId; S.level="L3"; }
  S.flashId=null; render(prev);
}

/* ================= 3D 视差 ================= */
function bindTilt(){
  var cards=fbody.querySelectorAll("[data-tilt]");
  for(var i=0;i<cards.length;i++){
    (function(c){
      c.onmousemove=function(e){
        var r=c.getBoundingClientRect();
        var px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
        c.style.transform="perspective(700px) rotateY("+(px*5).toFixed(2)+"deg) rotateX("+(-py*5).toFixed(2)+"deg) translateZ(0)";
        c.classList.add("tilt");
      };
      c.onmouseleave=function(){ c.style.transform=""; c.classList.remove("tilt"); };
    })(cards[i]);
  }
}

/* ================= 磁吸主按钮 ================= */
function bindMagnet(){
  var btns=document.querySelectorAll(".pbtn");
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.onmousemove=function(e){
        var r=b.getBoundingClientRect();
        var dx=((e.clientX-r.left)/r.width-0.5)*6, dy=((e.clientY-r.top)/r.height-0.5)*4;
        b.style.transform="translate("+dx.toFixed(2)+"px,"+dy.toFixed(2)+"px) scale(1.012)";
      };
      b.onmouseleave=function(){ b.style.transform=""; };
    })(btns[i]);
  }
}
/* ================= popover 系统（取代底部弹窗） ================= */
var popHost=document.getElementById("popHost"), toastHost=document.getElementById("toastHost"), modalHost=document.getElementById("modalHost");
var popEl=null, anchorEl=null, onPopClose=null;
function placePop(pop, anchor){
  var r=anchor.getBoundingClientRect(), pr=pop.getBoundingClientRect();
  var vw=window.innerWidth, vh=window.innerHeight, gap=9, below=(r.bottom+gap+pr.height) <= (vh-8);
  var top = below ? (r.bottom+gap) : Math.max(8, r.top-gap-pr.height);
  var fr=document.querySelector(".frame"), fb=fr?fr.getBoundingClientRect():{left:8,right:vw-8};
  var pad=10;
  var minL=Math.max(pad, fb.left+pad), maxL=Math.min(vw-pr.width-pad, fb.right-pr.width-pad);
  if(maxL<minL) maxL=Math.max(pad, vw-pr.width-pad);
  var centered=r.left + r.width/2 - pr.width/2;
  var want = centered;
  if(centered > maxL) want = r.right - pr.width;            /* 右侧放不下：右对齐锚点，向左展开 */
  else if(centered < minL) want = r.left;                    /* 左侧放不下：左对齐锚点，向右展开 */
  var left = Math.min(Math.max(minL, want), maxL);
  pop.style.top=top+"px"; pop.style.left=left+"px";
  var arrow=pop.querySelector(".arrow");
  if(arrow){
    var ax=Math.min(Math.max(12, r.left + r.width/2 - left - 5), Math.max(12, pr.width-22));
    arrow.style.left=ax+"px";
    if(!below) arrow.classList.add("b"); else arrow.classList.remove("b");
  }
  pop.style.setProperty("--ox", Math.round(r.left + r.width/2 - left)+"px");
  pop.style.setProperty("--oy", below ? "0%" : "100%");
}
function openPop(anchor, opts){
  opts=opts||{};
  closePop(true);
  var width=opts.width||300;
  var html = (opts.scrim===false ? "" : "<div class=\"scrim\" data-pop-close></div>")
    + "<div class=\"pop\" role=\"dialog\" aria-modal=\"true\" aria-label=\""+esc(opts.label||"操作")+"\" style=\"width:min("+width+"px,calc(100vw - 20px))\">"
    + "<div class=\"ppo\">"+opts.html+"</div>"
    + (opts.foot ? "<div class=\"pfoot\">"+opts.foot+"</div>" : "")
    + "<span class=\"arrow\"></span></div>";
  popHost.innerHTML=html;
  popEl=popHost.querySelector(".pop"); anchorEl=anchor;
  if(anchor && anchor.classList) anchor.classList.add("anchor");
  placePop(popEl, anchor);
  if(opts.onClose) onPopClose=opts.onClose;
  var sc=popHost.querySelector("[data-pop-close]"); if(sc) sc.onclick=function(){ closePop(); };
  var closers=popHost.querySelectorAll("[data-pop-close-btn]");
  for(var i=0;i<closers.length;i++) closers[i].onclick=function(){ closePop(); };
  bindPopDrag();
  var f=popEl.querySelector("input,select,button:not([data-pop-close-btn])");
  if(f) setTimeout(function(){ try{ f.focus(); }catch(e){} },40);
  return popEl;
}
function closePop(immediate){
  if(!popEl){ popHost.innerHTML=""; return; }
  if(anchorEl && anchorEl.classList) anchorEl.classList.remove("anchor");
  var node=popEl, cb=onPopClose;
  popEl=null; anchorEl=null; onPopClose=null;
  if(immediate){ popHost.innerHTML=""; if(cb) cb(); return; }
  node.classList.add("closing");
  setTimeout(function(){ popHost.innerHTML=""; },130);
  if(cb) cb();
}
function bindPopDrag(){
  var startX=0,startY=0,dragging=false;
  popEl.addEventListener("pointerdown", function(e){
    if(e.target.closest("button,input,select,.menu")) return;
    dragging=true; startX=e.clientX; startY=e.clientY;
    popEl.classList.add("dragging"); popEl.setPointerCapture&&popEl.setPointerCapture(e.pointerId);
  });
  popEl.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dx=e.clientX-startX, dy=e.clientY-startY;
    popEl.style.transform="translate("+dx+"px,"+dy+"px) scale("+(1-Math.min(Math.abs(dy)/1400,.03)+")");
  });
  popEl.addEventListener("pointerup", function(e){
    if(!dragging) return; dragging=false; popEl.classList.remove("dragging");
    var dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dy)>70 || Math.abs(dx)>110){ closePop(); return; }
    popEl.style.transition="transform 260ms cubic-bezier(.34,1.36,.4,1)";
    popEl.style.transform="";
    setTimeout(function(){ if(popEl) popEl.style.transition=""; },280);
  });
}
function dropdown(anchor, items, label){
  var html="<div class=\"menu\">"+items.map(function(it){
    return (it.sep ? "<span class=\"sep\"></span>" : "")
      + "<button data-dd=\""+it.act+"\""+(it.danger?" class=\"danger\"":"")+">"
      + "<svg class=\"i\"><use href=\"#"+it.icon+"\"/></svg>"+esc(it.t)+"</button>";
  }).join("")+"</div>";
  var pop=openPop(anchor, {html:html, width:200, label:label||"更多操作"});
  var bs=pop.querySelectorAll("[data-dd]");
  for(var i=0;i<bs.length;i++){
    bs[i].onclick=(function(b){ return function(){ var k=b.getAttribute("data-dd"); closePop(true); doAct(k, anchor, b.getAttribute("data-id")); }; })(bs[i]);
  }
  return pop;
}

}

/* ================= toast ================= */
function toast(text, kind, opts){
  opts=opts||{};
  var el=document.createElement("div");
  el.className="toast"+(kind==="bad"?" bad":(kind==="ok"?" ok":""));
  el.innerHTML="<svg class=\"i ti\"><use href=\"#"+(kind==="bad"?"i-alert":(kind==="ok"?"i-check":"i-info"))+"\"/></svg>"
    + "<span class=\"tx\">"+text+"</span>"
    + (opts.undo ? "<button class=\"pbtn-s\" style=\"height:26px;padding:0 9px;font-size:11.5px\" id=\"tdUndo\">撤销</button>" : "")
    + (opts.progress ? "<span class=\"prog\"><i></i></span>" : "");
  toastHost.appendChild(el);
  if(opts.progress){ var bar=el.querySelector(".prog i"); bar.style.transitionDuration=(opts.duration||1400)+"ms"; requestAnimationFrame(function(){ bar.style.transform="scaleX(0)"; }); }
  var undo=el.querySelector("#tdUndo");
  if(undo) undo.onclick=function(){ closeToast(el); if(opts.undo) opts.undo(); };
  var sx=0,sy=0,down=false;
  el.addEventListener("pointerdown", function(e){ down=true; sx=e.clientX; sy=e.clientY; el.style.animation="none"; });
  el.addEventListener("pointermove", function(e){ if(!down) return; var dx=e.clientX-sx, dy=e.clientY-sy; el.style.transform="translate("+dx+"px,"+dy+"px)"; el.style.opacity=String(Math.max(.35,1-Math.abs(dy)/160)); });
  el.addEventListener("pointerup", function(e){ if(!down) return; down=false; var dy=e.clientY-sy, dx=e.clientX-sx; if(Math.abs(dy)>54||Math.abs(dx)>120){ closeToast(el); return; } el.style.transform=""; el.style.opacity="1"; });
  var life=opts.duration||3600;
  var timer=setTimeout(function(){ closeToast(el); }, life+ (opts.progress?(opts.duration||1400):0));
  el._timer=timer;
  return el;
}
function closeToast(el){
  if(!el || el._closed) return; el._closed=true; clearTimeout(el._timer);
  el.classList.add("out");
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },170);
}

function suggest(){

  if(!q){ suggEl.hidden=true; return; }
  var out=[];
  S.homes.forEach(function(h){ var n=homeName(h); if(match(n)) out.push({kind:"家", label:n, id:h.id, level:"L2", sub:h.path||"未关联工作区"}); });
  S.assistants.forEach(function(a){ var n=asstName(a); if(match(n)) out.push({kind:"助理", label:n, id:a.id, level:"L3", sub:(CH[a.channel]||a.channel)+" · "+asstPath(a)}); });

      + "<span style=\"display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">"+esc(o.sub)+"</span></span>"
      + "<span class=\"kind\">"+o.kind+"</span></button>";

    html:popTitleBar("助理详情","i-data")});
  var pop=popEl;
  pop.querySelector(".ppo").insertAdjacentHTML("beforeend","<dl class=\"kv\">"+rows.map(function(r){ return "<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>"; }).join("")+"</dl>");
}
function homeKidsPop(h, anchor){

    ? "<dl class=\"kv\">"+kids.map(function(x){ var b=botOf(x);
        return "<dt>"+esc(asstName(x))+"</dt><dd>"+esc(CH[x.channel]||x.channel)+" · "+(b?(b.online?"在线":"离线"):"无渠道")+" · "+esc(x.status==="bound"?"已绑":(x.status==="unbound"?"未绑定":"失联"))+"</dd>"; }).join("")+"</dl>"

}
function newHomePop(anchor){
  S.pick.mode="pick";
  var fw=freeWs();
  var wsItems=fw.map(function(w){ return {v:w.id, t:w.title, sub:w.path, i:w.title.charAt(0), style:avStyle(null,w.title)}; });

      + "<div id=\"wrapWs\">"+fLabel("<span>已有工作区</span>","")+optList(wsItems, S.pick.opt)+"</div>"
      + "<div id=\"wrapDir\" style=\"display:none\">"+fLabel("<span>新目录</span>","<input id=\"fDir\" value=\"D:\\DeepSeekHarness\\agents\\hupan\">")+"</div>"
      + "<p class=\"fhint\">家和工作区一一对应：复用就只写本插件，新建会先建工作区再落家。</p>",
    foot:"<button class=\"pbtn-s\" data-pop-close-btn>取消</button><button class=\"pbtn-s go\" id=\"nOk\">创建</button>"});

    var nid=uid("h");

      S.homes.push({id:nid, workspaceId:w.id, path:w.path, name:w.title, nameSource:"system", avatar:null});
      toast("新建家 <b>"+esc(w.title)+"</b>：复用了已有工作区","ok");

      var dir=pop.querySelector("#fDir").value.trim()||("D:\\DeepSeekHarness\\agents\\new"+S.seq);
      var wid=uid("ws"), base=dir.split(/[\\/]/).pop();
      S.workspaces.push({id:wid, title:base, path:dir});
      S.homes.push({id:nid, workspaceId:wid, path:dir, name:base, nameSource:"system", avatar:null});
      toast("新建家 <b>"+esc(base)+"</b>：先建工作区，再落家","ok");
    }
    closePop(true); S.selHome=nid; go("L2");
  };
}
function newAsstPop(anchor){
  var fb=freeBots(), hs=S.homes.filter(function(x){ return !x.tombstone; });
  var homeItems=hs.map(function(x){ return {v:x.id, t:homeName(x), sub:x.path||"未关联工作区", i:homeName(x).charAt(0), style:avStyle(x,homeName(x))}; });
  var botItems=[{v:"", t:"以后再绑", sub:"先占位，之后随时绑号", i:"占"}].concat(fb.map(function(b){ return {v:b.id, t:b.name, sub:(CH[b.channel]||b.channel)+(b.online?" · 在线":" · 离线"), i:b.name.charAt(0), style:avStyle(null,b.name)}; }));
  S.pick.opt=S.selHome||homeItems[0].v; S.pick.bot="";

      + fLabel("<span>名字</span>","<input id=\"fName\" placeholder=\"留空按回落取名\">")
      + "<p class=\"fhint\">先建人、后绑号：机器人可以先不选，名字留空时已绑用机器人名，未绑用家名。</p>",

/* ================= modal（走查 / 状态） ================= */
function modal(title, bodyHtml, footHtml){
  modalHost.innerHTML="<div class=\"modal\"><div class=\"mbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\""+esc(title)+"\">"
    + "<div class=\"mhead\"><b>"+esc(title)+"</b><span class=\"spacer\"></span><button class=\"ibtn\" data-mclose aria-label=\"关闭\"><svg class=\"i\"><use href=\"#i-x\"/></svg></button></div>"
    + "<div class=\"mbody\">"+bodyHtml+"</div>"
    + (footHtml?"<div class=\"pfoot\">"+footHtml+"</div>":"")
    + "</div></div>";
  var m=modalHost.querySelector(".modal");
  m.onclick=function(e){ if(e.target===m) closeModal(); };
  var cs=modalHost.querySelectorAll("[data-mclose]"); for(var i=0;i<cs.length;i++) cs[i].onclick=closeModal;
}
function closeModal(){ modalHost.innerHTML=""; }
var STEPS=[
  {k:"s1",t:"建家：复用已有工作区"},
  {k:"s2",t:"建家：新建一个工作区"},
  {k:"s3",t:"先建助理，后绑机器人"},
  {k:"s4",t:"接入：让助理开始收消息"},
  {k:"s5",t:"改名冻结与恢复默认"},
  {k:"s6",t:"删除助理与撤销"},
  {k:"s7",t:"TAB 向前钻取"}
];
var HINTS={
  s1:"点底部“新建家”，方式选“复用工作区”，确定后列表多一项，名字自动等于工作区名。",
  s2:"点底部“新建家”，切到“新建工作区”，改个目录名，会先建工作区再落家。",
  s3:"点底部“新建助理”，名字留空、不绑机器人，它先显示家名；再到详情点“绑定机器人”。",
  s4:"进任意助理详情点“接入”：弹层里先转圈再出结果；B号是离线，会给出失败原因和“重试”。",
  s5:"先在弹层里“重命名”，再点“模拟：工作区改名”，它不动；点“恢复默认名”才跟回。",
  s6:"详情里点“删除助理”，确认后列表补位动画 + 右下 toast 带“撤销”，点撤销它会回来。",
  s7:"TAB 向前钻取：在列表页把鼠标移到任意一行上，顶部 L2/L3 标签会跟着显示那一行，点它就直接进去。"
};
document.getElementById("btnWalk").onclick=function(){
  modal("一键走查",
    "<p class=\"fhint\">窄面板里一次只做一件事：按顺序点，每步都会说明看哪里。</p>"
    + "<div class=\"steplist\">"+STEPS.map(function(s,i){ return "<button data-step=\""+s.k+"\">"+(i+1)+". "+esc(s.t)+"</button>"; }).join("")+"</div>"
    + "<p class=\"fhint\" id=\"stepHint\">选一个步骤开始。</p>"
    + "<div class=\"menu\" style=\"border-top:1px solid var(--line-soft);padding-top:8px\">"
    + "<button data-sim=\"rename-ws\"><svg class=\"i\"><use href=\"#i-refresh\"/></svg>模拟：工作区改名</button>"
    + "<button data-sim=\"toggle-online\"><svg class=\"i\"><use href=\"#i-link\"/></svg>模拟：机器人掉线 / 恢复</button>"
    + "<button data-sim=\"del-ws\" class=\"danger\"><svg class=\"i\"><use href=\"#i-x\"/></svg>模拟：删除工作区</button></div>");
  var sb=modalHost.querySelectorAll("[data-step]");
  for(var i=0;i<sb.length;i++){
    sb[i].onclick=(function(b){ return function(){
      var all=modalHost.querySelectorAll("[data-step]");
      for(var k=0;k<all.length;k++) all[k].setAttribute("aria-pressed","false");
      b.setAttribute("aria-pressed","true");
      modalHost.querySelector("#stepHint").textContent=HINTS[b.getAttribute("data-step")];
    }; })(sb[i]);
  }
  var ms=modalHost.querySelectorAll("[data-sim]");
  for(var j=0;j<ms.length;j++){
    ms[j].onclick=(function(b){ return function(){
      var k=b.getAttribute("data-sim"); closeModal();
      if(k==="rename-ws"){
        var w=byId(S.workspaces,"ws-keting"); w.title=(w.title==="客厅"?"大客厅":"客厅");
        render(); toast("工作区改名成 <b>"+esc(w.title)+"</b>：没改过名的家跟着变，改过名的不动","ok");
      } else if(k==="toggle-online"){
        var tb=byId(S.bots,"bot-fei"); tb.online=!tb.online;
        render(); toast("机器人 <b>"+esc(tb.name)+"</b> 现在"+(tb.online?"在线":"离线")+"，列表标记与“接入”结果同步","ok");
      } else {
        var w2=byId(S.workspaces,"ws-keting"); w2.deleted=true;
        var hh=byId(S.homes,"h1"); hh.workspaceId=null; hh.tombstone={reason:"工作区已删除"};
        render(); toast("工作区已删除：这个家标记为“待重连”，重新选个目录就能接上","bad");
      }
    }; })(ms[j]);
  }
};
document.getElementById("btnState").onclick=function(){
  var data={ level:S.level,
    homes:S.homes.map(function(h){ return {id:h.id, name:homeName(h), from:homeFrom(h), path:h.path, tombstone:!!h.tombstone, assistants:S.assistants.filter(function(a){ return a.homeId===h.id; }).length}; }),
    assistants:S.assistants.map(function(a){ var b=botOf(a); return {id:a.id, home:a.homeId, name:asstName(a), from:asstFrom(a), channel:a.channel, bot:a.botId, online:b?!!b.online:null, status:a.status}; }) };
  modal("状态外显", "<div class=\"diff\">"+esc(S.lastDiff)+"</div><pre class=\"json\">"+esc(JSON.stringify(data,null,1))+"</pre>",
    "<button class=\"pbtn-s\" data-mclose>关闭</button>");
};
document.getElementById("btnReset").onclick=function(){ S=seed(); closePop(true); closeModal(); render(); toast("已重置回种子","ok"); };

/* ================= 事件 ================= */
document.addEventListener("click", function(e){
  var ia=e.target.closest("[data-item-act]");
  if(ia){ e.stopPropagation(); var row=ia.closest("[data-open]");
    if(row){ if(row.getAttribute("data-open")==="L3"){ S.selAsst=row.getAttribute("data-id"); } else { S.selHome=row.getAttribute("data-id"); } }
    doAct(ia.getAttribute("data-item-act"), ia, ia.getAttribute("data-id")); return; }
  var got=e.target.closest("[data-goto]"); if(got){ crumbGo(got.getAttribute("data-goto")); return; }
  var op=e.target.closest("[data-open]");
  if(op){ var lv=op.getAttribute("data-open"), id=op.getAttribute("data-id");
    if(lv==="L2"){ S.selHome=id; } else { S.selAsst=id; var a=asstById(id); if(a) S.selHome=a.homeId; }
    go(lv); return; }
  var act=e.target.closest("[data-act]"); if(act){ doAct(act.getAttribute("data-act"), act); return; }
});
document.addEventListener("contextmenu", function(e){
  var row=e.target.closest(".row"); if(!row) return;
  e.preventDefault();
  var isAsst = row.getAttribute("data-open")==="L3";
  if(isAsst){ S.selAsst=row.getAttribute("data-id"); } else { S.selHome=row.getAttribute("data-id"); }
  doAct(isAsst?"more-asst":"more-home", row);
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ if(popEl){ closePop(); return; } if(modalHost.innerHTML){ closeModal(); return; } if(!suggEl.hidden){ suggEl.hidden=true; return; } }
  if(e.target.classList && e.target.classList.contains("row") && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.click(); return; }
  if(!suggEl.hidden && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault();
    var bs=suggEl.querySelectorAll("[data-sg]"); if(!bs.length) return;
    S.hl=(S.hl+(e.key==="ArrowDown"?1:bs.length-1))%bs.length;
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle("hl", i===S.hl);
    return;
  }
  if(!suggEl.hidden && e.key==="Enter"){ e.preventDefault(); pickSugg(S.hl<0?0:S.hl); return; }
  if(popEl && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    var items=popEl.querySelectorAll(".menu button"); if(!items.length) return;
    e.preventDefault();
    S.hl=(S.hl+(e.key==="ArrowDown"?1:items.length-1))%items.length;
    for(var k=0;k<items.length;k++) items[k].classList.toggle("hl", k===S.hl);
    return;
  }
  if(popEl && e.key==="Enter" && e.target.tagName!=="INPUT" && e.target.tagName!=="BUTTON"){
    var hl=popEl.querySelector(".menu button.hl"); if(hl){ e.preventDefault(); hl.click(); }
  }
});
var qEl=document.getElementById("q");
qEl.addEventListener("input", function(){ S.q=qEl.value.trim(); suggest(); if(S.level!=="L3"){ var prev=flipCapture(); render(prev); } });
qEl.addEventListener("focus", function(){ suggest(); });
document.addEventListener("click", function(e){ if(!e.target.closest(".fsearch")) suggEl.hidden=true; });
backBtn.onclick=function(){ closePop(true); go(S.level==="L3" ? "L2" : "L1"); };
fAdd.onclick=function(e){ doAct(S.level==="L1" ? "new-home" : "new-asst", e.currentTarget); };
fMore.onclick=function(e){ doAct("more-home", e.currentTarget); };
window.addEventListener("resize", function(){ if(popEl && anchorEl) placePop(popEl, anchorEl); if(tablk) slideTab(true); });
fbody.addEventListener("pointerover", function(e){
  var r=e.target.closest("[data-open]");
  if(r){ setFocus(r.getAttribute("data-id")); return; }
  setFocus(null);
});
fbody.addEventListener("pointerleave", function(){ setFocus(null); });
fbody.addEventListener("focusin", function(e){
  var r=e.target.closest("[data-open]"); if(r) setFocus(r.getAttribute("data-id"));
});
fbody.addEventListener("focusout", function(){ setFocus(null); });
fbody.addEventListener("scroll", function(){ if(popEl) closePop(true); });

/* ================= 启动 ================= */
render();
setTimeout(function(){
  S.loading=false; render();
  bindMagnet();
  toast("已读取 4 个家、6 位助理。右击任意一行可以打开快捷菜单。","ok");
}, 720);
</script>
