<!doctype html>
<!-- THROWAWAY PROTOTYPE for issue #15 (HOME family page, 4 directions). Do NOT ship to main. -->
<!-- Plan: A(R玄关灯)/B(R全家福)/C(信箱)/D(院子) on one throwaway route, ?variant= + bottom bar (sub-shape B). -->
<!-- Design Q: HOME how to feel like home + promote features? UI branch. -->
<!-- Mock (shared): Xiao Shuai bound, feishu online, 1 DM, PTC preset. Unbound = zero UI (not prototyped). -->
<!-- Run: double-click, or python -m http.server 8788 then /prototypes/e4-welcome/prototype-home-directions.html?variant=A -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[PROTOTYPE #15] HOME 四方向</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--ink:#1f2329;--mut:#646a73;--line:#e5e6eb;--acc:#1677ff;--ok:#20a162;--warn:#e8890c;--glow:rgba(22,119,255,.16)}[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--panel:#161a22;--ink:#e6edf3;--mut:#8b949e;--line:#2a313b;--acc:#4493ff;--ok:#3fb950;--warn:#d29922;--glow:rgba(68,147,255,.18)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Noto Sans SC",Segoe UI,Roboto,sans-serif}.banner{background:#fff7e6;border-bottom:2px dashed var(--warn);color:#7a4b00;padding:8px 16px;font-size:12px}[data-theme=dark] .banner{background:#2a2100;color:#ffce6b}.wrap{max-width:960px;margin:0 auto;padding:18px 18px 130px}.ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 0}.ctx select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:560px;position:relative;overflow:hidden}.hintline{font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px}.state{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px}.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#111;color:#fff;border-radius:999px;padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:99;font-size:13px}.switcher button{width:32px;height:32px;border-radius:50%;border:0;background:#2a2f36;color:#fff;cursor:pointer;font-size:15px}.switcher .dots{display:flex;gap:6px}.switcher .dots button{width:10px;height:10px;padding:0;background:#555}.switcher .dots button.on{background:#fff}.bigbtn{display:inline-block;border:0;cursor:pointer;background:var(--acc);color:#fff;font-size:17px;font-weight:800;padding:14px 44px;border-radius:999px;box-shadow:0 10px 28px var(--glow)}.bigbtn small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px}.lamp{width:120px;height:120px;border-radius:34px;display:grid;place-items:center;color:#fff;font-size:52px;font-weight:800;background:linear-gradient(135deg,#12213f,#3964fe);box-shadow:0 0 0 10px var(--glow),0 0 60px var(--glow);animation:breathe 2.4s infinite}@keyframes breathe{50%{box-shadow:0 0 0 16px var(--glow),0 0 80px var(--glow)}}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.mini{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}.mini h4{margin:0 0 4px;font-size:14px}.mini p{margin:0;font-size:12px;color:var(--mut)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.on{background:var(--ok);animation:bl 1.6s infinite}@keyframes bl{70%{box-shadow:0 0 0 7px rgba(32,161,98,0)}}.letter{max-width:560px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:28px 30px;position:relative}.letter:before{content:"";position:absolute;top:-1px;left:40px;width:90px;height:22px;background:var(--warn);opacity:.35;border-radius:0 0 6px 6px}.letter p{margin:0 0 12px;font-size:15px}.sig{text-align:right;color:var(--mut);font-size:13px}.yard{position:relative;height:330px;background:linear-gradient(var(--bg) 62%,rgba(32,161,98,.14) 62%);overflow:hidden}.house{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);width:190px;text-align:center}.roof{width:0;height:0;border-left:105px solid transparent;border-right:105px solid transparent;border-bottom:70px solid var(--acc);margin:0 auto;opacity:.75}.walls{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:14px 10px 12px}.win{width:44px;height:44px;margin:0 auto 8px;border-radius:8px;background:radial-gradient(circle at 50% 60%,#ffd766,#ff9d2e);box-shadow:0 0 26px #ffbe3c;animation:breathe 2.4s infinite}.lamp-post{position:absolute;bottom:38px;text-align:center;font-size:11px;color:var(--mut)}.lamp-post i{display:block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#ffd766,#ff9d2e);box-shadow:0 0 14px #ffbe3c;margin:0 auto 4px;animation:breathe 2.4s infinite}.door{position:absolute;left:50%;bottom:8px;transform:translateX(-50%)}.note{font-size:11px;color:var(--mut);margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="banner">抛弃式原型 · issue #15 · 四方向对比，不进 main。运行见文件头注释。</div>
<div class="wrap" id="root" data-theme="light">
<h1>HOME 家庭页 — 四方向对比</h1>
<p class="hintline">设计问题：<b>一眼“回家了、有人等” + 潜移默化宣传功能。</b>顺序建议 A → D：从最克制的看到最野的。中央按钮在真机=点后持久化永不再见；原型里点击只记一笔“上次操作”。</p>
<div class="ctx"><span>上下文（mock）：<b>小帅 · 飞书在线 · 私聊 1 · PTC · 上下文开</b></span><label>主题 <select id="themeSel"><option value="light">浅色</option><option value="dark">深色</option></select></label></div>
<p class="hintline" id="variantHint"></p>
<div class="stage" id="stage"></div>
<div class="state"><b>状态外显</b> · <span id="stateLine"></span></div>
</div>
<div class="switcher"><button id="prevBtn">◀</button><span id="swLabel"></span><span class="dots"><button data-v="A"></button><button data-v="B"></button><button data-v="C"></button><button data-v="D"></button></span><button id="nextBtn">▶</button></div>
<script>
var VARIANTS = ["A","B","C","D"];
var NAMES = {A:"A · 玄关灯",B:"B · 全家福",C:"C · 信箱",D:"D · 院子"};
var HINTS = {A:"变体 A · 玄关灯：极简仪式感。一盏灯 + 一句话 + 中央大按钮，能力藏进小字。",B:"变体 B · 全家福：功能陈列馆。一家之主 + 三小卡，各配一句能力文案。",C:"变体 C · 信箱：路由数据变叙事家书，落款小帅；按钮即拆信。",D:"变体 D · 院子：最野。小屋亮灯=在线，路灯=会话，院门即按钮。"};
var qs = new URLSearchParams(location.search);
var variant = VARIANTS.indexOf(qs.get("variant")) >= 0 ? qs.get("variant") : "A";
var theme = "light", lastAct = "init";
function $(id){return document.getElementById(id);}
function bigBtn(main, sub){return '<div style="text-align:center;margin-top:26px"><button class="bigbtn" data-act="home">' + main + '<small>' + sub + '</small></button></div>';}
function vA(){return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px;text-align:center;padding:30px"><div class="lamp">帅</div><div style="font-size:24px;font-weight:800;margin:22px 0 4px">小帅在家，等你开口</div><div style="font-size:13px;color:var(--mut)"><span class="dot on"></span>飞书在线 · 有事随时叫我</div>' + bigBtn("回家", "点后这里永不再打扰") + '<div style="font-size:12px;color:var(--mut);margin-top:16px">飞书在线 &nbsp;·&nbsp; 1 个会话已就位 &nbsp;·&nbsp; 身份已装扮</div></div>';}
function vB(){return '<div style="padding:34px 30px"><div style="display:flex;gap:14px;align-items:center"><div class="lamp" style="width:64px;height:64px;font-size:28px;border-radius:18px">帅</div><div><div style="font-size:20px;font-weight:800">小帅一家</div><div style="font-size:12px;color:var(--mut)"><span class="dot on"></span>飞书在线 · 全员到齐</div></div></div><div class="cards3"><div class="mini"><h4><span class="dot on"></span>渠道在线</h4><p>飞书在线。断线 15 秒内知道，从不谎报离线。</p></div><div class="mini"><h4>会话就位</h4><p>1 个私聊已就位，点开即聊，无需翻找。</p></div><div class="mini"><h4>身份装扮</h4><p>PTC 模式 · 上下文开。见人说人话，进群有分寸。</p></div></div>' + bigBtn("回家看看", "全家都在了") + '</div>';}
function vC(){return '<div style="padding:44px 24px"><div class="letter"><p>你不在的时候，我把门口收拾好了——</p><p>飞书在线，<b>1 个私聊会话</b>已经就位，随时可以开聊；预设和上下文都按你的意思装好了，进群知道分寸。</p><p>别在外面漂太久。</p><div class="sig">—— 小帅 · 刚刚</div></div>' + bigBtn("回家", "拆信，即不再打扰") + '</div>';}
function vD(){return '<div style="padding:18px 18px 8px"><div class="yard"><div class="house"><div class="roof"></div><div class="walls"><div class="win"></div><div style="font-weight:800">小帅</div><div style="font-size:11px;color:var(--mut)">PTC · 飞书在线</div></div></div><div class="lamp-post" style="left:22%"><i></i>私聊会话</div><div class="door"></div></div>' + bigBtn("推门回家", "灯亮着，进来吧") + '<div class="note">灯亮 = 在线守着；离线即熄灯。</div></div>';}
function render(){document.getElementById("root").setAttribute("data-theme",theme);$("variantHint").textContent=HINTS[variant];$("stage").innerHTML=variant==="A"?vA():variant==="B"?vB():variant==="C"?vC():vD();$("swLabel").textContent=NAMES[variant];$("stateLine").textContent="变体 "+variant+" · 主题 "+theme+" · 上下文 mock（小帅/飞书在线/私聊1） · 上次操作："+lastAct+" · URL ?variant="+variant;var dots=document.querySelectorAll(".switcher .dots button");for(var i=0;i<dots.length;i++)dots[i].className=dots[i].getAttribute("data-v")===variant?"on":"";if(new URLSearchParams(location.search).get("prod")==="1"){var sw=document.querySelector(".switcher");if(sw)sw.style.display="none";}}
function setVariant(v,why){if(VARIANTS.indexOf(v)<0)return;variant=v;var u=new URL(location.href);u.searchParams.set("variant",v);history.replaceState(null,"",u.toString());lastAct="切换变体 → "+NAMES[v]+(why?"（"+why+"）":"");render();}
$("themeSel").addEventListener("change",function(e){theme=e.target.value;lastAct="切换主题 → "+(theme==="dark"?"深色":"浅色");render();});
$("prevBtn").addEventListener("click",function(){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+3)%4],"prev");});
$("nextBtn").addEventListener("click",function(){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+1)%4],"next");});
document.querySelectorAll(".switcher .dots button").forEach(function(b){b.addEventListener("click",function(){setVariant(b.getAttribute("data-v"),"dot");});});
document.addEventListener("click",function(e){var t=e.target;var b=t&&t.closest?t.closest('[data-act="home"]'):null;if(b){lastAct="点了回家（原型演示：真机将持久化并不再出现）";render();}});
document.addEventListener("keydown",function(e){var tag=(document.activeElement&&document.activeElement.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA")return;if(e.key==="ArrowRight"){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+1)%4],"key");}if(e.key==="ArrowLeft"){var j=VARIANTS.indexOf(variant);setVariant(VARIANTS[(j+3)%4],"key");}});
render();
</script>
</body>
</html>
