<style>
:root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--ink:#1f2329;--mut:#646a73;--line:#e5e6eb;--acc:#1677ff;--ok:#20a162;--warn:#e8890c;--gold:#c98a12;--glow:rgba(22,119,255,.16)}[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--panel:#161a22;--ink:#e6edf3;--mut:#8b949e;--line:#2a313b;--acc:#4493ff;--ok:#3fb950;--warn:#d29922;--gold:#d29922;--glow:rgba(68,147,255,.18)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Noto Sans SC",Segoe UI,Roboto,sans-serif}.banner{background:#fff7e6;border-bottom:2px dashed var(--warn);color:#7a4b00;padding:8px 16px;font-size:12px}[data-theme=dark] .banner{background:#2a2100;color:#ffce6b}.wrap{max-width:960px;margin:0 auto;padding:18px 18px 130px}.ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 0}.ctx select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:560px;position:relative;overflow:hidden}.hintline{font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px}.state{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px}.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#111;color:#fff;border-radius:999px;padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:99;font-size:13px;max-width:96vw}.switcher button{width:32px;height:32px;border-radius:50%;border:0;background:#2a2f36;color:#fff;cursor:pointer;font-size:15px;flex:none}.switcher .dots{display:flex;gap:6px}.switcher .dots button{width:10px;height:10px;padding:0;background:#555}.switcher .dots button.on{background:#fff}.bigbtn{display:inline-block;border:0;cursor:pointer;background:var(--acc);color:#fff;font-size:17px;font-weight:800;padding:14px 44px;border-radius:999px;box-shadow:0 10px 28px var(--glow)}.bigbtn small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px}.lamp{width:120px;height:120px;border-radius:34px;display:grid;place-items:center;color:#fff;font-size:52px;font-weight:800;background:linear-gradient(135deg,#12213f,#3964fe);box-shadow:0 0 0 10px var(--glow),0 0 60px var(--glow);animation:breathe 2.4s infinite}@keyframes breathe{50%{box-shadow:0 0 0 16px var(--glow),0 0 80px var(--glow)}}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.mini{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}.mini h4{margin:0 0 4px;font-size:14px}.mini p{margin:0;font-size:12px;color:var(--mut)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.on{background:var(--ok);animation:bl 1.6s infinite}@keyframes bl{70%{box-shadow:0 0 0 7px rgba(32,161,98,0)}}.letter{max-width:560px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:28px 30px;position:relative}.letter:before{content:"";position:absolute;top:-1px;left:40px;width:90px;height:22px;background:var(--warn);opacity:.35;border-radius:0 0 6px 6px}.letter p{margin:0 0 12px;font-size:15px}.sig{text-align:right;color:var(--mut);font-size:13px}.dayone{font-size:110px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--acc),var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent}.medal{width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;color:#fff;font-size:64px;font-weight:800;background:radial-gradient(circle at 35% 30%,#ffd766,var(--gold) 70%);box-shadow:0 0 0 12px var(--glow),0 0 70px var(--glow);animation:breathe 2.4s infinite;border:6px solid var(--panel)}.cert{max-width:520px;margin:18px auto 0;background:var(--bg);border:1px solid var(--gold);border-radius:14px;padding:18px 22px;text-align:center}.cert h4{margin:0 0 8px;font-size:16px;letter-spacing:.1em}.cert p{margin:4px 0;font-size:13px;color:var(--mut)}.cert b{color:var(--ink)}.bubble{max-width:540px;background:var(--bg);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:16px 20px;font-size:15px}.checkrow{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px auto;max-width:520px}.tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800}.note{font-size:11px;color:var(--mut);margin-top:10px;text-align:center}

</head>
<body>
<div class="banner">抛弃式原型 · issue #15 · 第二轮七方向（D 已排除），不进 main。运行见文件头注释。</div>
<div class="wrap" id="root" data-theme="light">
<h1>HOME 家庭页 — 第二轮七方向</h1>
<p class="hintline">设计问题：<b>一眼“回家了、有人等” + 潜移默化宣传功能。</b>第一性收敛：只给“已绑定且没点过按钮”看一次，中央按钮点后永别，只用真数据。顺序建议 A→H：先看最克制的。</p>
<div class="ctx"><span>上下文（mock）：<b>小帅 · 飞书在线 · 私聊 1 · PTC · 上下文开</b></span><label>主题 <select id="themeSel"><option value="light">浅色</option><option value="dark">深色</option></select></label></div>
<p class="hintline" id="variantHint"></p>
<div class="stage" id="stage"></div>
<div class="state"><b>状态外显</b> · <span id="stateLine"></span></div>
</div>
<div class="switcher"><button id="prevBtn">◀</button><span id="swLabel"></span><span class="dots" id="dots"></span><button id="nextBtn">▶</button></div>
<script>
var VARIANTS = ["A","B","C","E","F","G","H"];
var NAMES = {A:"A 玄关灯",B:"B 全家福",C:"C 信箱",E:"E 第一天",F:"F 授勋",G:"G 第一句话",H:"H 拎包入住"};
var HINTS = {A:"A 玄关灯：一盏灯一句中央大按钮。",B:"B 全家福：一家之主加三小卡。",C:"C 信箱：家书加拆信。",E:"E 第一天：一生一次，DAY ONE。",F:"F 授勋：勋章加委任状，档案全是真数据。",G:"G 第一句话：HOME 就是一条消息，按钮是快捷回复。",H:"H 拎包入住：3/3 通关清单，全是真状态。"};
var qs = new URLSearchParams(location.search);
var variant = VARIANTS.indexOf(qs.get("variant")) >= 0 ? qs.get("variant") : "A";
var theme = "light", lastAct = "初始化";
function $(id){return document.getElementById(id);}
function bigBtn(main, sub){return '<div style="text-align:center;margin-top:26px"><button class="bigbtn" data-act="home">' + main + '<small>' + sub + '</small></button></div>';}
function vA(){return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px;text-align:center;padding:30px"><div class="lamp">帅</div><div style="font-size:24px;font-weight:800;margin:22px 0 4px">小帅在家，等你开口</div><div style="font-size:13px;color:var(--mut)"><span class="dot on"></span>飞书在线 · 有事随时叫我</div>' + bigBtn("回家","点后这里永不再打扰") + '<div style="font-size:12px;color:var(--mut);margin-top:16px">飞书在线 &nbsp;·&nbsp; 1 个会话已就位 &nbsp;·&nbsp; 身份已装扮</div></div>';}
function vB(){return '<div style="padding:34px 30px"><div style="display:flex;gap:14px;align-items:center"><div class="lamp" style="width:64px;height:64px;font-size:28px;border-radius:18px">帅</div><div><div style="font-size:20px;font-weight:800">小帅一家</div><div style="font-size:12px;color:var(--mut)"><span class="dot on"></span>飞书在线 · 全员到齐</div></div></div><div class="cards3"><div class="mini"><h4><span class="dot on"></span>渠道在线</h4><p>飞书在线。断线 15 秒内知道，从不谎报离线。</p></div><div class="mini"><h4>会话就位</h4><p>1 个私聊已就位，点开即聊，无需翻找。</p></div><div class="mini"><h4>身份装扮</h4><p>PTC 模式 · 上下文开。见人说人话，进群有分寸。</p></div></div>' + bigBtn("回家看看","全家都在了") + '</div>';}
function vC(){return '<div style="padding:44px 24px"><div class="letter"><p>你不在的时候，我把门口收拾好了——</p><p>飞书在线，<b>1 个私聊会话</b>已经就位，随时可以开聊；预设和上下文都按你的意思装好了，进群知道分寸。</p><p>别在外面漂太久。</p><div class="sig">—— 小帅 · 刚刚</div></div>' + bigBtn("回家","拆信，即不再打扰") + '</div>';}
function vE(){return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px;text-align:center;padding:30px"><div class="dayone">01</div><div style="font-size:13px;letter-spacing:.35em;color:var(--mut)">DAY ONE</div><div style="font-size:22px;font-weight:800;margin:14px 0 4px">今天是你们认识的第一天</div><div style="font-size:13px;color:var(--mut)">小帅会记住今天 · 这个页面一生只出现一次</div>' + bigBtn("回家","一生一次，点后永别") + '</div>';}
function vF(){return '<div style="padding:40px 24px;text-align:center"><div class="medal">帅</div><div class="cert"><h4>委 任 状</h4><p>兹任命 <b>小帅</b> 为本家守护者</p><p>麾下 <b>飞书在线</b> · 职级 <b>PTC 模式</b> · 心法 <b>上下文开</b></p></div>' + bigBtn("挂牌上任","受命，即不再打扰") + '</div>';}
function vG(){return '<div style="padding:60px 30px"><div style="display:flex;gap:12px;align-items:flex-end;max-width:600px;margin:0 auto"><div class="lamp" style="width:48px;height:48px;font-size:22px;border-radius:14px;flex:none">帅</div><div class="bubble"><b>小帅：</b>你终于来了，我是小帅。飞书那边 <b>1 个私聊会话</b>已经替你候着，进群的事也备好了。</div></div><div style="text-align:center;margin-top:22px"><button class="bigbtn" data-act="home" style="font-size:15px;padding:11px 34px">我回来了</button></div><div class="note">上面是小帅发来的第一条消息，下面是你唯一的快捷回复。</div></div>';}
function vH(){return '<div style="padding:40px 24px"><div style="text-align:center;font-size:22px;font-weight:800">拎包入住</div><div style="text-align:center;font-size:13px;color:var(--mut);margin:4px 0 14px">入住手续 3/3 已办妥</div><div class="checkrow"><span class="tick">✓</span><div><b>渠道接通</b><div style="font-size:12px;color:var(--mut)">飞书在线。断线 15 秒内知道，从不谎报离线。</div></div></div><div class="checkrow"><span class="tick">✓</span><div><b>会话就位</b><div style="font-size:12px;color:var(--mut)">1 个私聊已就位，点开即聊。</div></div></div><div class="checkrow"><span class="tick">✓</span><div><b>身份装扮</b><div style="font-size:12px;color:var(--mut)">PTC 模式 · 上下文开。</div></div></div>' + bigBtn("拎包入住","手续齐了，进门吧") + '</div>';}
function render(){document.getElementById("root").setAttribute("data-theme",theme);$("variantHint").textContent=HINTS[variant];var body=$("stage");var htm=variant==="A"?vA():variant==="B"?vB():variant==="C"?vC():variant==="E"?vE():variant==="F"?vF():variant==="G"?vG():vH();body.innerHTML=htm;$("swLabel").textContent=NAMES[variant];$("stateLine").textContent="变体 "+variant+" · 主题 "+theme+" · 上下文 mock（小帅/飞书在线/私聊1） · 上次操作："+lastAct+" URL ?variant="+variant;var box=$("dots");var dh="";for(var i=0;i<VARIANTS.length;i++){dh+='<button data-v="'+VARIANTS[i]+'" title="'+NAMES[VARIANTS[i]]+'" class="'+(VARIANTS[i]===variant?"on":"")+'"></button>';}box.innerHTML=dh;var dots=box.querySelectorAll("button");for(var j=0;j<dots.length;j++)(function(b){b.addEventListener("click",function(){setVariant(b.getAttribute("data-v"),"圆点直达");});})(dots[j]);if(new URLSearchParams(location.search).get("prod")==="1"){var sw=document.querySelector(".switcher");if(sw)sw.style.display="none";}}
function setVariant(v,why){if(VARIANTS.indexOf(v)<0)return;variant=v;var u=new URL(location.href);u.searchParams.set("variant",v);history.replaceState(null,"",u.toString());lastAct="切换变体 → "+NAMES[v]+(why?"（"+why+"）":"");render();}
$("themeSel").addEventListener("change",function(e){theme=e.target.value;lastAct="切换主题 → "+(theme==="dark"?"深色":"浅色");render();});
$("prevBtn").addEventListener("click",function(){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+VARIANTS.length-1)%VARIANTS.length],"◀");});
$("nextBtn").addEventListener("click",function(){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+1)%VARIANTS.length],"▶");});
document.addEventListener("click",function(e){var t=e.target;var b=t&&t.closest?t.closest('[data-act="home"]'):null;if(b){lastAct="点了回家（原型演示：真机将持久化并不再出现）";render();}});
document.addEventListener("keydown",function(e){var tag=(document.activeElement&&document.activeElement.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA")return;if(e.key==="ArrowRight"){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+1)%VARIANTS.length],"键盘");}if(e.key==="ArrowLeft"){var k=VARIANTS.indexOf(variant);setVariant(VARIANTS[(k+VARIANTS.length-1)%VARIANTS.length],"键盘");}});
render();
</script>
</body>
</html>
