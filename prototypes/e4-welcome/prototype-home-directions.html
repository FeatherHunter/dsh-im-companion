function stopParticles(){try{if(pRAF)cancelAnimationFrame(pRAF);}catch(e){}pRAF=0;}
function startParticles(cv){stopParticles();try{var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;var W=cv.clientWidth||880,H=420;var dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;var ctx=cv.getContext("2d");ctx.scale(dpr,dpr);var N=64,ps=[];for(var i=0;i<N;i++)ps.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*1.8+.6});var cx=W/2,cy=H/2,t=0;function frame(){if(variant!=="N"){pRAF=0;return;}t+=.02;ctx.clearRect(0,0,W,H);ctx.strokeStyle="rgba(125,185,240,.28)";ctx.lineWidth=1;for(var a=0;a<N;a++){for(var b=a+1;b<N;b++){var pa=ps[a],pb=ps[b],dx=pa.x-pb.x,dy=pa.y-pb.y;if(dx*dx+dy*dy<14400){ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();}}}for(var k=0;k<N;k++){var p=ps[k];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H;ctx.fillStyle="rgba(125,185,240,.9)";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}var pr=10+Math.sin(t*2)*2;var g=ctx.createRadialGradient(cx,cy,2,cx,cy,pr*4);g.addColorStop(0,"rgba(255,214,102,.95)");g.addColorStop(1,"rgba(255,214,102,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,pr*4,0,6.283);ctx.fill();ctx.fillStyle="#12213f";ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("帅",cx,cy);if(reduce){pRAF=0;return;}pRAF=requestAnimationFrame(frame);}frame();}catch(e){}}
function vN(){return '<div style="position:relative;background:#0b1020;overflow:hidden"><canvas id="pcv"></canvas><div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:20px"><div class="rise" style="font-size:24px;font-weight:800;color:#fff">满屋星尘，都是为你点的灯</div><div class="rise" style="font-size:13px;color:#cdd6e4;animation-delay:.12s;margin-top:6px"><span class="dot on"></span>飞书在线 · 1 个会话同频 · 小帅在中间</div></div></div><div style="text-align:center;padding:18px 18px 4px">' + bigBtn("回家","星尘为你让路") + '</div><div class="note">64 粒星尘实时漂移连线（Canvas + rAF，离开本变体即停，减弱动效偏好即静帧）；中间最亮的是小帅。</div>';}
function vO(){return '<div class="tilt" id="tiltZone" style="padding:44px 24px"><div class="tilt-inner" id="tiltInner" style="text-align:center"><div class="lyr rise" style="--z:70px"><div class="lamp" style="margin:0 auto">帅</div></div><div class="lyr rise" style="--z:40px;animation-delay:.1s;font-size:24px;font-weight:800;margin:16px 0 4px">动动鼠标，院子跟着你转</div><div class="lyr rise" style="--z:20px;animation-delay:.2s;font-size:13px;color:var(--mut)"><span class="dot on"></span>飞书在线 · 3D 纵深实时响应</div><div class="lyr rise" style="--z:50px;animation-delay:.3s">' + bigBtn("回家","所见即家") + '</div><div class="lyr note" style="--z:10px;animation-delay:.4s">三层纵深 + 入场编排 + 指针视差（触屏与减弱动效自动降级）。</div></div></div>';}
function wireTilt(){try{var zone=$("tiltZone"),inner=$("tiltInner");if(!zone||!inner)return;if(!window.matchMedia||!window.matchMedia("(hover:hover)").matches)return;zone.onmousemove=function(e){try{var r=zone.getBoundingClientRect();var px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;inner.style.transform="rotateY("+(px*14)+"deg) rotateX("+(-py*12)+"deg)";}catch(err){}};zone.onmouseleave=function(){try{inner.style.transform="rotateY(0deg) rotateX(0deg)";}catch(err){}};}catch(e){}}
function render(){document.getElementById("root").setAttribute("data-theme",theme);$("variantHint").textContent=HINTS[variant];var body=$("stage");var htm=variant==="A"?vA():variant==="C"?vC():variant==="E"?vE():variant==="G"?vG():variant==="I"?vI():variant==="J"?vJ():variant==="K"?vK():variant==="L"?vL():variant==="M"?vM():variant==="N"?vN():variant==="O"?vO():vH();body.innerHTML=htm;if(variant==="N"){var cv=$("pcv");if(cv)startParticles(cv);}else{stopParticles();}if(variant==="O"){wireTilt();}$("swLabel").textContent=NAMES[variant];$("stateLine").textContent="变体 "+variant+" · 主题 "+theme+" · 上下文 mock（小帅/飞书在线/私聊1） · 上次操作："+lastAct+" URL ?variant="+variant;var box=$("dots");var dh="";for(var i=0;i<VARIANTS.length;i++){dh+='<button data-v="'+VARIANTS[i]+'" title="'+NAMES[VARIANTS[i]]+'" class="'+(VARIANTS[i]===variant?"on":"")+'"></button>';}box.innerHTML=dh;var dots=box.querySelectorAll("button");for(var j=0;j<dots.length;j++)(function(b){b.addEventListener("click",function(){setVariant(b.getAttribute("data-v"),"圆点直达");});})(dots[j]);if(new URLSearchParams(location.search).get("prod")==="1"){var sw=document.querySelector(".switcher");if(sw)sw.style.display="none";}}
function setVariant(v,why){if(VARIANTS.indexOf(v)<0)return;variant=v;var u=new URL(location.href);u.searchParams.set("variant",v);history.replaceState(null,"",u.toString());lastAct="切换变体 → "+NAMES[v]+(why?"（"+why+"）":"");render();}
$("themeSel").addEventListener("change",function(e){theme=e.target.value;lastAct="切换主题 → "+(theme==="dark"?"深色":"浅色");render();});
$("prevBtn").addEventListener("click",function(){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+VARIANTS.length-1)%VARIANTS.length],"◀");});
$("nextBtn").addEventListener("click",function(){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+1)%VARIANTS.length],"▶");});
document.addEventListener("click",function(e){var t=e.target;var b=t&&t.closest?t.closest('[data-act="home"]'):null;if(b){lastAct="点了回家（原型演示）";render();}});
document.addEventListener("keydown",function(e){var tag=(document.activeElement&&document.activeElement.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA")return;if(e.key==="ArrowRight"){var i=VARIANTS.indexOf(variant);setVariant(VARIANTS[(i+1)%VARIANTS.length],"键盘");}if(e.key==="ArrowLeft"){var k=VARIANTS.indexOf(variant);setVariant(VARIANTS[(k+VARIANTS.length-1)%VARIANTS.length],"键盘");}});
render();
</script>
</body>
