<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2 拖拽领养状态机原型（抛弃式）</title>
<style>
  :root { --accent:#0a84ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif; background:#f2f3f5; color:#1c1c1e; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:960px; margin:0 auto; padding:20px 16px 80px; }
  .proto-tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.06em; color:#fff; background:#b42318; border-radius:6px; padding:3px 8px; margin-bottom:10px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .lede { font-size:14px; color:#555; margin:0 0 12px; line-height:1.7; }
  .card { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:14px; margin:0 0 14px; overflow:hidden; }
  .card-hd { padding:12px 16px; border-bottom:1px solid rgba(0,0,0,.07); font-weight:700; font-size:14px; }
  .card-bd { padding:14px 16px; }
  .q { font-size:13px; line-height:1.8; margin:0; }
  .q b { color:var(--accent); }
  .assume { font-size:12px; color:#777; margin:8px 0 0; line-height:1.7; }
  .changed { font-size:13px; background:rgba(10,132,255,.09); border:1px solid rgba(10,132,255,.3); border-radius:10px; padding:8px 12px; margin:0 0 12px; line-height:1.6; }
  .banner { font-size:13px; border-radius:10px; padding:10px 12px; margin:0 0 12px; line-height:1.6; }
  .banner.confirm { background:#fff7e6; border:1px solid #e6a700; }
  .banner.toast { background:#eef7ee; border:1px solid #1a9e54; }
  .banner.drag { background:#eef4ff; border:1px dashed var(--accent); }
  .cols { display:grid; gap:10px; }
  @media(min-width:760px){ .cols { grid-template-columns:1fr 1fr; } }
  .wsgrid { display:grid; gap:10px; }
  @media(min-width:760px){ .wsgrid { grid-template-columns:1fr 1fr 1fr; } }
  .ws { border:1px solid rgba(0,0,0,.1); border-radius:12px; padding:12px; background:#f7f8fa; min-height:86px; }
  .ws.hover-ok { outline:2px solid #1a9e54; background:#f0faf3; }
  .ws.hover-bad { outline:2px solid #b42318; background:#fdf1f0; }
  .ws-name { font-weight:700; font-size:14px; }
  .ws-sub { font-size:11px; color:#777; }
  .bot { display:inline-block; font-size:12px; font-weight:700; border:1px solid rgba(0,0,0,.16); background:#fff; border-radius:999px; padding:4px 10px; margin:6px 6px 0 0; }
  .bot.dragging { border-color:var(--accent); color:var(--accent); }
  .pool { border:1px dashed rgba(0,0,0,.2); border-radius:12px; padding:12px; margin-top:10px; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btnrow h4 { width:100%; margin:10px 0 0; font-size:12px; color:#777; }
  button.act { font:inherit; font-size:12.5px; padding:7px 12px; border-radius:10px; border:1px solid rgba(0,0,0,.14); background:#fff; cursor:pointer; }
  button.act:hover { border-color:var(--accent); color:var(--accent); }
  button.act.done { border-color:var(--accent); background:rgba(10,132,255,.12); color:var(--accent); }
  button.act.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.act.danger { border-color:#b42318; color:#b42318; }
  button.act:disabled { opacity:.45; cursor:default; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { font:inherit; font-size:13px; font-weight:700; padding:8px 14px; border-radius:10px; border:1px solid rgba(0,0,0,.14); background:#fff; cursor:pointer; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .scenario { font-size:13px; line-height:1.8; background:#f7f8fa; border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .log { font-size:12px; line-height:1.8; color:#555; background:#f7f8fa; border-radius:10px; padding:10px 12px; margin:12px 0 0; max-height:150px; overflow:auto; }
  .foot { font-size:12px; color:#777; line-height:1.8; }
  kbd { font-family:inherit; font-size:11px; background:rgba(0,0,0,.06); border-radius:4px; padding:1px 5px; }
</style>
</head>
<body>
<div class="wrap">
  <span class="proto-tag">PROTOTYPE · 抛弃式 · 不进 main</span>
  <h1>E2 · 拖拽领养状态机</h1>
  <p class="lede">要回答的问题：<b>把 Fleet 的 Bot 拖到左栏工作区完成绑定，这套状态流转顺不顺？</b>覆盖：放置目标判定（仅工作区行可放、空位不可放）、冲突（已被绑定 → 二次确认后换绑）、撤销（toast 5s 后悔药）。下面每个按钮都是一次真实的状态迁移，点完看“当前状态”面板。</p>

  <div class="card"><div class="card-hd">当前状态（每次点击后重渲染）</div><div class="card-bd" id="state"></div></div>

  <div class="card"><div class="card-hd">自由操作（随便点，顺序不限）</div><div class="card-bd" id="free"></div></div>

  <div class="card"><div class="card-hd">分步走查（点 Tab 会重置到已知起点，再按顺序点步骤按钮）</div><div class="card-bd">
    <div class="tabs" id="tabs"></div>
    <div class="scenario" id="scenario"></div>
    <div class="btnrow" id="steps"></div>
  </div></div>

  <div class="card"><div class="card-hd">假设与开放问题</div><div class="card-bd"><p class="foot" id="openq"></p></div></div>
</div>

<script id="e2-logic">
/* ===== 纯模块：拖拽领养状态机（无 DOM，可整体搬进真代码；页面只是壳）===== */
'use strict';
var WS = [
  { id: 'ws-a', name: '工作区 A · 小帅' },
  { id: 'ws-b', name: '工作区 B · 阿梨' },
  { id: 'ws-c', name: '工作区 C · 老墨' },
];
var BOTS = [
  { id: 'bot-feishu-1', channel: '飞书' },
  { id: 'bot-wechat-1', channel: '微信' },
  { id: 'bot-qq-1', channel: 'QQ' },
  { id: 'bot-feishu-2', channel: '飞书' },
];
var SEED = { 'bot-qq-1': 'ws-a', 'bot-feishu-2': 'ws-b' }; // 冲突走查用的已绑定起点
var UNDO_STEPS = 3; // toast 撤销窗口：3 次“时间流逝”后过期（演示用，真实现再定 5s）

function botName(id) { return id; }
function wsName(id) {
  for (var i = 0; i < WS.length; i++) if (WS[i].id === id) return WS[i].name;
  return id;
}
function initialState() {
  var bind = {};
  for (var k in SEED) bind[k] = SEED[k];
  return { bind: bind, drag: null, confirm: null, toast: null, lastChange: '初始：2 个未绑定，2 个已绑定。', log: ['init：起点已就绪'] };
}
function say(s, msg) { s.lastChange = msg; s.log = s.log.concat([msg]).slice(-30); return s; }

/* reducer：(state, action) => state，全纯函数 */
function reduce(s, a) {
  var n = JSON.parse(JSON.stringify(s));
  switch (a.type) {
    case 'reset': return initialState();
    case 'start': {
      if (n.drag) return say(n, '已在拖拽中，先放下或取消（一次只拖一个）。');
      if (n.confirm) return say(n, '确认弹窗开着，先处理它。');
      n.drag = { botId: a.bot, over: null };
      n.toast = null;
      return say(n, '拿起 ' + a.bot + '（' + channelOf(a.bot) + '），拖到左栏工作区行上。');
    }
    case 'over': {
      if (!n.drag) return say(n, '手里没拿东西，悬停无效。');
      n.drag.over = a.target;
      if (a.target === 'empty') return say(n, '悬停在空白处 → 不可放（E2 不做“拖出新建”，走现有新建流程）。');
      if (a.target === null) return say(n, '悬停离开目标。');
      var cur = n.bind[n.drag.botId] || null;
      if (!cur) return say(n, '悬停在' + wsName(a.target) + ' → 可放（未绑定，直绑）。');
      if (cur === a.target) return say(n, '悬停在' + wsName(a.target) + ' → 它已经在这里，放下=无操作。');
      return say(n, '悬停在' + wsName(a.target) + ' → 可放但有冲突（现属' + wsName(cur) + '，放下会弹确认）。');
    }
    case 'drop': {
      if (!n.drag) return say(n, '手里没拿东西，放下无效。');
      var d = n.drag; n.drag = null;
      if (d.over === null || d.over === 'empty')
        return say(n, '放在' + (d.over === 'empty' ? '空白处' : '目标之外') + ' → 拒绝，绑定关系不变。');
      var now = n.bind[d.botId] || null;
      if (!now) {
        n.bind[d.botId] = d.over;
        n.toast = { botId: d.botId, from: null, to: d.over, left: UNDO_STEPS };
        return say(n, '绑定成功：' + d.botId + ' → ' + wsName(d.over) + '（toast 撤销窗口已开）。');
      }
      if (now === d.over) return say(n, '它本来就在' + wsName(d.over) + '，无操作。');
      n.confirm = { botId: d.botId, from: now, to: d.over };
      return say(n, '冲突：' + d.botId + ' 现属' + wsName(now) + ' → 弹二次确认，确认后换绑到' + wsName(d.over) + '。');
    }
    case 'cancel-drag': {
      if (!n.drag) return say(n, '没在拖，无事可取消。');
      var b = n.drag.botId; n.drag = null;
      return say(n, '取消拖拽（Esc / 拖回原处），' + b + ' 回到原位。');
    }
    case 'confirm-yes': {
      if (!n.confirm) return say(n, '没有待确认的换绑。');
      var c = n.confirm; n.confirm = null;
      n.bind[c.botId] = c.to;
      n.toast = { botId: c.botId, from: c.from, to: c.to, left: UNDO_STEPS };
      return say(n, '已换绑：' + c.botId + ' 从' + wsName(c.from) + ' → ' + wsName(c.to) + '（仍可 toast 撤销）。');
    }
    case 'confirm-no': {
      if (!n.confirm) return say(n, '没有待确认的换绑。');
      var c2 = n.confirm; n.confirm = null;
      return say(n, '已取消换绑：' + c2.botId + ' 留在' + wsName(c2.from) + '。');
    }
    case 'undo': {
      if (!n.toast) return say(n, '没有可撤销的绑定（窗口已关或已过期）。');
      var t = n.toast; n.toast = null;
      if (t.from === null) delete n.bind[t.botId];
      else n.bind[t.botId] = t.from;
      return say(n, '已撤销：' + t.botId + ' 回到' + (t.from === null ? '未绑定池' : wsName(t.from)) + '。');
    }
    case 'tick': {
      if (!n.toast) return say(n, '没有开着的撤销窗口，时间流逝无事发生。');
      n.toast.left -= 1;
      if (n.toast.left <= 0) { n.toast = null; return say(n, '撤销窗口过期：绑定已落定，此时再点“撤销”会被拒绝。'); }
      return say(n, '时间流逝…撤销窗口还剩 ' + n.toast.left + ' 步。');
    }
  }
  return n;
}
function channelOf(id) {
  for (var i = 0; i < BOTS.length; i++) if (BOTS[i].id === id) return BOTS[i].channel;
  return '?';
}
</script>

<script>
/* ===== 壳：渲染 + 接线（throwaway，不搬）===== */
'use strict';
var S = initialState();
var STEP_IDX = 0, CURRENT_TAB = 0;

var TABS = [
  { key: 'happy', label: '走查 1 · 正常绑定',
    desc: '起点：bot-feishu-1 未绑定。把它拖到工作区 B，直绑成功 + toast 撤销窗口打开；再让时间流逝到过期，验证“过期后撤销被拒绝”。看点：过期语义是否符合预期。',
    steps: [['start:bot-feishu-1','拿起 bot-feishu-1'], ['over:ws-b','悬停到工作区 B'], ['drop','放下 → 绑定'], ['tick','时间流逝 ×1'], ['tick','时间流逝 ×2'], ['tick','过期 ×3'], ['undo','再点撤销（应被拒绝）']] },
  { key: 'conflict', label: '走查 2 · 冲突换绑+撤销',
    desc: '起点：bot-qq-1 已属工作区 A。把它拖到工作区 B → 弹二次确认 → 确认换绑 → toast 撤销 → 回到 A。看点：最绕的一条链，确认文案与撤销回滚是否对。',
    steps: [['start:bot-qq-1','拿起 bot-qq-1（已属A）'], ['over:ws-b','悬停到工作区 B'], ['drop','放下 → 弹确认'], ['confirm-yes','确认换绑到 B'], ['undo','撤销 → 回到 A']] },
  { key: 'illegal', label: '走查 3 · 非法尝试',
    desc: '三种“应该什么都不发生”的情况：放到空白处、悬停就松手（目标之外）、放回自己所在的工作区。看点：拒绝提示清不清晰，有没有误写。',
    steps: [['start:bot-wechat-1','拿起 bot-wechat-1'], ['over:empty','悬停到空白处'], ['drop','放下（应拒绝）'], ['start:bot-qq-1','拿起 bot-qq-1（已属A）'], ['over:ws-a','悬停回工作区 A'], ['drop','放下（应无操作）']] },
  { key: 'cancel', label: '走查 4 · 取消与反悔',
    desc: '拖到一半取消（Esc），以及冲突确认时点“留在这里”。看点：取消后状态是否干净（无残留 drag / confirm）。',
    steps: [['start:bot-feishu-2','拿起 bot-feishu-2（已属B）'], ['over:ws-c','悬停到工作区 C'], ['cancel-drag','取消拖拽'], ['start:bot-feishu-2','再拿起'], ['over:ws-c','悬停到工作区 C'], ['drop','放下 → 弹确认'], ['confirm-no','点“留在这里”']] },
];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function occupant(wsId){
  var out = [];
  for (var i = 0; i < BOTS.length; i++) if (S.bind[BOTS[i].id] === wsId) out.push(BOTS[i]);
  return out;
}
function renderState(){
  var el = document.getElementById('state'), h = '';
  h += '<div class="changed">刚才发生了什么：' + esc(S.lastChange) + '</div>';
  if (S.drag) h += '<div class="banner drag">🖐 手里拿着 <b>' + esc(S.drag.botId) + '</b>（' + esc(channelOf(S.drag.botId)) + '）' + (S.drag.over ? '，悬停在：<b>' + esc(S.drag.over === 'empty' ? '空白处' : wsName(S.drag.over)) + '</b>' : '，还没悬停到任何目标') + '</div>';
  if (S.confirm) h += '<div class="banner confirm">⚠️ 二次确认：<b>' + esc(S.confirm.botId) + '</b> 现属' + esc(wsName(S.confirm.from)) + '，换绑到 <b>' + esc(wsName(S.confirm.to)) + '</b>？<div class="btnrow" style="margin-top:8px"><button class="act primary" data-a="confirm-yes">确认换绑</button><button class="act" data-a="confirm-no">留在这里</button></div></div>';
  if (S.toast) h += '<div class="banner toast">✅ 已绑定 <b>' + esc(S.toast.botId) + '</b> → ' + esc(wsName(S.toast.to)) + '（撤销窗口还剩 ' + S.toast.left + ' 步） <div class="btnrow" style="margin-top:8px"><button class="act" data-a="undo">撤销</button><button class="act" data-a="tick">⏳ 时间流逝</button></div></div>';
  h += '<div class="wsgrid">';
  for (var i = 0; i < WS.length; i++){
    var w = WS[i], occ = occupant(w.id), cls = 'ws';
    if (S.drag && S.drag.over === w.id) cls += ((S.bind[S.drag.botId] && S.bind[S.drag.botId] !== w.id) ? ' hover-bad' : ' hover-ok');
    h += '<div class="' + cls + '"><div class="ws-name">' + esc(w.name) + '</div><div class="ws-sub">' + esc(w.id) + '</div><div>';
    if (!occ.length) h += '<div class="ws-sub" style="margin-top:8px">（空）</div>';
    for (var j = 0; j < occ.length; j++) h += '<span class="bot' + (S.drag && S.drag.botId === occ[j].id ? ' dragging' : '') + '">' + esc(occ[j].id) + ' · ' + esc(occ[j].channel) + '</span>';
    h += '</div></div>';
  }
  h += '</div><div class="pool"><div class="ws-sub">未绑定池（Fleet / 待领养）</div><div>';
  var any = false;
  for (var k = 0; k < BOTS.length; k++) if (!S.bind[BOTS[k].id]){ any = true; h += '<span class="bot' + (S.drag && S.drag.botId === BOTS[k].id ? ' dragging' : '') + '">' + esc(BOTS[k].id) + ' · ' + esc(BOTS[k].channel) + '</span>'; }
  if (!any) h += '<div class="ws-sub">（空：全被领养了，点“重置”回到起点）</div>';
  h += '</div><div class="ws-sub" style="margin-top:6px">左侧三块 = 左栏工作区行（唯一可放目标）；本虚线框之外 = 空白处（不可放）。源为抽象 Bot 行，不绑定 C1a/C1b 具体控件（grilling 结论）。</div></div>';
  h += '<div class="log">' + S.log.slice(-8).map(esc).join('<br>') + '</div>';
  el.innerHTML = h;
}
function parseStep(s){
  var i = s.indexOf(':');
  if (i < 0) return { type: s };
  return { type: s.slice(0, i), bot: s.slice(i + 1) === 'empty' || s.slice(i+1).indexOf('ws-') === 0 ? undefined : s.slice(i + 1), raw: s.slice(i + 1) };
}
function fire(spec){
  var p = spec.indexOf(':');
  if (p < 0) { S = reduce(S, { type: spec }); }
  else {
    var t = spec.slice(0, p), v = spec.slice(p + 1);
    if (t === 'start') S = reduce(S, { type: 'start', bot: v });
    else if (t === 'over') S = reduce(S, { type: 'over', target: v === 'null' ? null : v });
    else S = reduce(S, { type: spec });
  }
  sync();
}
function renderFree(){
  var el = document.getElementById('free'), h = '<div class="btnrow">';
  h += '<h4>拿起（拖拽源 = 抽象 Bot 行）</h4>';
  for (var i = 0; i < BOTS.length; i++) h += '<button class="act" data-f="start:' + BOTS[i].id + '">拿起 ' + BOTS[i].id + '</button>';
  h += '<h4>悬停（放置目标判定）</h4>';
  for (var j = 0; j < WS.length; j++) h += '<button class="act" data-f="over:' + WS[j].id + '">悬停 ' + WS[j].id + '</button>';
  h += '<button class="act" data-f="over:empty">悬停空白处</button>';
  h += '<button class="act" data-f="over:null">悬停离开</button>';
  h += '<h4>放下 / 收尾</h4><button class="act primary" data-f="drop">放下（drop）</button><button class="act" data-f="cancel-drag">取消拖拽（Esc）</button><button class="act danger" data-f="reset">重置到起点</button>';
  h += '</div>';
  el.innerHTML = h;
}
function renderTabs(){
  var el = document.getElementById('tabs'), h = '';
  for (var i = 0; i < TABS.length; i++) h += '<button data-t="' + i + '" class="' + (i === CURRENT_TAB ? 'on' : '') + '">' + esc(TABS[i].label) + '</button>';
  el.innerHTML = h;
  document.getElementById('scenario').textContent = TABS[CURRENT_TAB].desc;
  renderSteps();
}
function renderSteps(){
  var el = document.getElementById('steps'), h = '';
  var steps = TABS[CURRENT_TAB].steps;
  for (var i = 0; i < steps.length; i++)
    h += '<button class="act' + (i < STEP_IDX ? ' done' : '') + '" data-s="' + i + '"' + (i !== STEP_IDX ? ' disabled' : '') + '>' + (i + 1) + '. ' + esc(steps[i][1]) + '</button>';
  if (STEP_IDX >= steps.length) h += '<span class="ws-sub">走查完毕：上面的“刚才发生了什么”就是本场景的 verdict；也可继续用自由操作乱点。</span>';
  el.innerHTML = h;
}
function sync(){ renderState(); renderSteps(); }
document.addEventListener('click', function(e){
  var t = e.target;
  if (!(t instanceof HTMLElement)) return;
  if (t.hasAttribute('data-a')) { S = reduce(S, { type: t.getAttribute('data-a') }); sync(); return; }
  if (t.hasAttribute('data-f')) { fire(t.getAttribute('data-f')); return; }
  if (t.hasAttribute('data-t')) { CURRENT_TAB = +t.getAttribute('data-t'); STEP_IDX = 0; S = reduce(S, { type: 'reset' }); renderTabs(); sync(); return; }
  if (t.hasAttribute('data-s')) {
    var i = +t.getAttribute('data-s');
    if (i !== STEP_IDX) return;
    fire(TABS[CURRENT_TAB].steps[i][0]);
    STEP_IDX++;
    renderSteps();
  }
});
