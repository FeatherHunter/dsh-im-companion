<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向A · 客厅（暖家居）</title>
<style>
body{margin:0;background:#f3efe7;color:#3d3225;font-family:-apple-system,"PingFang SC",sans-serif;}
.wrap{max-width:880px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:15px;margin:0 0 4px;} .sub{font-size:12px;opacity:.6;margin:0 0 22px;}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.home{background:#fffdf9;border-radius:26px;padding:20px 18px 16px;box-shadow:0 6px 24px rgba(120,90,40,.10);}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.face{width:38px;height:38px;border-radius:16px;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;}
.nm{font-size:17px;font-weight:800;} .ct{margin-left:auto;font-size:11px;opacity:.55;background:rgba(120,90,40,.10);border-radius:99px;padding:2px 10px;}
.row{display:flex;align-items:center;gap:9px;margin-top:8px;padding:11px 14px;border-radius:16px;font-size:14px;cursor:grab;background:rgba(120,90,40,.07);border:1.5px solid transparent;transition:transform .13s ease,box-shadow .13s ease,background .13s ease,border-color .13s ease;}
.row:hover{transform:translateY(-2px);background:#fff;box-shadow:0 8px 20px rgba(120,90,40,.18);border-color:var(--c,#0a84ff);}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#d8d2c4;}
.dot.on{background:#34c759;box-shadow:0 0 8px rgba(52,199,89,.8);}
.ch{margin-left:auto;font-size:12px;opacity:.55;}
.row.drag{opacity:.4;transform:scale(1.03);}
.home.over{outline:2.5px solid var(--c,#0a84ff);outline-offset:3px;}
.hint{font-size:11px;opacity:.55;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>方向A · 客厅 <span style="font-weight:400;opacity:.6;">—— 暖家居，靠垫式成员</span></h1>
  <p class="sub">悬停成员行会上浮（先把鼠标放上去不动）；拖拽换家照常。问题：暖不暖？软不软？</p>
  <div class="grid" id="grid"></div>
  <p class="hint" id="msg">先悬停，再拖“群管家”去阿梨家。</p>
</div>
<script>
var homes=[
 {name:'小帅2',c:'#0a84ff',b:[['客服小冰','飞书','on'],['群管家','微信','on']]},
 {name:'阿梨',c:'#30a853',b:[['夜间值班','QQ','warn']]},
 {name:'老墨',c:'#a06ee1',b:[['商务一号','飞书','on'],['朋友圈号','微信','off'],['老客户群','QQ','on']]},
];
var drag=null;
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  homes.forEach(function(h,hi){
    var card=document.createElement('div');card.className='home';card.style.setProperty('--c',h.c);
    card.innerHTML='<div class="hd"><span class="face" style="background:'+h.c+'">'+h.name.charAt(0)+'</span><span class="nm">'+h.name+'</span><span class="ct">'+h.b.length+' 个机器人</span></div>';
    h.b.forEach(function(x){
      var r=document.createElement('div');r.className='row';
      r.innerHTML='<span class="dot '+(x[2]==='on'?'on':'')+'"></span><span>'+x[0]+'</span><span class="ch">'+x[1]+'</span>';
      r.setAttribute('draggable','true');
      r.addEventListener('dragstart',function(ev){drag={x:x,from:hi};r.classList.add('drag');ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',x[0]);}catch(e){}});
      r.addEventListener('dragend',function(){r.classList.remove('drag');clear();});
      card.appendChild(r);
    });
    card.addEventListener('dragover',function(ev){if(!drag)return;ev.preventDefault();clear();card.classList.add('over');});
    card.addEventListener('drop',function(ev){
      if(!drag)return;ev.preventDefault();clear();var d=drag;drag=null;
      if(d.from===hi){say('它已经在'+homes[hi].name+'家了');return;}
      homes[d.from].b.splice(homes[d.from].b.indexOf(d.x),1);homes[hi].b.push(d.x);render();
      say('“'+d.x[0]+'”搬到了'+homes[hi].name+'家');
    });
    g.appendChild(card);
  });
}
function clear(){document.querySelectorAll('.home.over').forEach(function(n){n.classList.remove('over');});}
function say(t){document.getElementById('msg').textContent=t;}
render();
</script>
</body>
</html>
