<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概念甲 · 门牌（大字报留白）</title>
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:15px;margin:0 0 4px;font-weight:700;}
.sub{font-size:12px;color:#86868b;margin:0 0 24px;}
.grid{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.home{position:relative;overflow:hidden;background:#fff;border-radius:20px;padding:28px 24px 20px;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.mark{position:absolute;right:-10px;bottom:-38px;font-size:150px;font-weight:900;line-height:1;color:#0a84ff;opacity:.07;pointer-events:none;}
.who{font-size:11px;letter-spacing:.2em;color:#86868b;margin-bottom:6px;}
.name{font-size:30px;font-weight:800;letter-spacing:.01em;margin:0;}
.count{font-size:12px;color:#86868b;margin:6px 0 16px;}
.row{display:flex;align-items:center;gap:9px;padding:11px 2px;border-top:1px solid #e8e8ed;font-size:14px;cursor:grab;background:#fff;}
.row:first-of-type{border-top:none;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#d2d2d7;}
.dot.on{background:#30d158;animation:br 1.8s infinite;}
.dot.warn{background:#ff9f0a;}
@keyframes br{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 7px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.ch{margin-left:auto;font-size:12px;color:#86868b;}
.row.drag{opacity:.4;}
.home.over{outline:2px solid #0a84ff;outline-offset:3px;}
.hint{font-size:11px;color:#86868b;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>概念甲 · 门牌 <span style="font-weight:400;color:#86868b;">—— 大字报留白，MUJI 式</span></h1>
  <p class="sub">直接拖成员换家（本地模拟）。第一眼问题：这是谁家？几部电话？通不通？</p>
  <div class="grid" id="grid"></div>
  <p class="hint" id="msg">把「群管家」拖到阿梨家试试。</p>
</div>
<script>
var homes=[
 {name:'小帅2',color:'#0a84ff',bots:[{n:'客服小冰',ch:'飞书',st:'on'},{n:'群管家',ch:'微信',st:'on'}]},
 {name:'阿梨',color:'#30d158',bots:[{n:'夜间值班',ch:'QQ',st:'warn'}]},
 {name:'老墨',color:'#bf5af2',bots:[{n:'商务一号',ch:'飞书',st:'on'},{n:'朋友圈号',ch:'微信',st:'off'},{n:'老客户群',ch:'QQ',st:'on'}]},
];
var drag=null;
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  homes.forEach(function(h,hi){
    var card=document.createElement('div');card.className='home';
    card.innerHTML='<div class="mark">'+h.name.charAt(0)+'</div><div class="who">HOME · 0'+(hi+1)+'</div><p class="name">'+h.name+'</p><p class="count">'+h.bots.length+' 个机器人</p>';
    h.bots.forEach(function(b){
      var r=document.createElement('div');r.className='row';r.setAttribute('draggable','true');
      r.innerHTML='<span class="dot '+(b.st==='on'?'on':b.st==='warn'?'warn':'')+'"></span><span>'+b.n+'</span><span class="ch">'+b.ch+'</span>';
      r.addEventListener('dragstart',function(ev){drag={b:b,from:hi};r.classList.add('drag');ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',b.n);}catch(e){}});
      r.addEventListener('dragend',function(){r.classList.remove('drag');clear();});
      card.appendChild(r);
    });
    card.addEventListener('dragover',function(ev){if(!drag)return;ev.preventDefault();clear();card.classList.add('over');});
    card.addEventListener('drop',function(ev){
      if(!drag)return;ev.preventDefault();clear();var d=drag;drag=null;
      if(d.from===hi){say('它已经在'+homes[hi].name+'家了');return;}
      homes[d.from].bots.splice(homes[d.from].bots.indexOf(d.b),1);
      homes[hi].bots.push(d.b);render();
      say('“'+d.b.n+'”搬到了'+homes[hi].name+'家');
    });
    g.appendChild(card);
  });
}
function clear(){document.querySelectorAll('.home.over').forEach(function(n){n.classList.remove('over');});}
function say(t){document.getElementById('msg').textContent=t;}
render();
</script>
</body>
</html>
