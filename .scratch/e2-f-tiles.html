<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向F · 磁贴墙（现代中性）</title>
<style>
body{margin:0;background:#eef0f4;color:#1d1d1f;font-family:-apple-system,"PingFang SC",sans-serif;}
.wrap{max-width:880px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:15px;margin:0 0 4px;} .sub{font-size:12px;color:#6e6e73;margin:0 0 22px;}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.home{background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-radius:20px;padding:16px 14px 12px;box-shadow:0 4px 20px rgba(30,40,80,.08);}
.hd{display:flex;align-items:center;gap:9px;margin:2px 4px 8px;}
.face{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;}
.nm{font-size:15px;font-weight:800;} .ct{margin-left:auto;font-size:11px;color:#6e6e73;}
.row{display:flex;align-items:center;gap:9px;margin:8px 4px 0;padding:11px 13px;border-radius:14px;font-size:14px;cursor:grab;background:#fff;box-shadow:0 2px 8px rgba(30,40,80,.10);border:1.5px solid transparent;transition:transform .13s ease,box-shadow .13s ease;}
.row:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 10px 22px rgba(30,40,80,.16);}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#d2d2d7;}
.dot.on{background:#30d158;box-shadow:0 0 7px rgba(48,209,88,.8);}
.ch{margin-left:auto;font-size:11px;color:#8e8e93;}
.row.drag{opacity:.45;transform:scale(1.04) rotate(-1.5deg);}
.row.ph{opacity:.4;transform:rotate(-3.5deg);border:1.5px dashed #aeb4c0;box-shadow:none;pointer-events:none;}
.home.over{outline:2.5px solid #0a84ff;outline-offset:3px;}
.home.over .row{transform:scale(1.01);}
.hint{font-size:11px;color:#6e6e73;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>方向F · 磁贴墙 <span style="font-weight:400;color:#6e6e73;">—— 现代中性，Win11 味</span></h1>
  <p class="sub">悬停上浮放大；拖起原位留歪斜虚线坑，目标家整组轻微放大"吸入"。问题：够现代吗？会不会太冷？</p>
  <div class="grid" id="grid"></div>
  <p class="hint" id="msg">拖“商务一号”去小帅2家，看坑和吸入。</p>
</div>
<script>
var FC=['#0a84ff','#30a853','#a06ee1'];
var homes=[
 {name:'小帅2',b:[['客服小冰','飞书','on'],['群管家','微信','on']]},
 {name:'阿梨',b:[['夜间值班','QQ','warn']]},
 {name:'老墨',b:[['商务一号','飞书','on'],['朋友圈号','微信','off'],['老客户群','QQ','on']]},
];
var drag=null;
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  homes.forEach(function(h,hi){
    var card=document.createElement('div');card.className='home';
    card.innerHTML='<div class="hd"><span class="face" style="background:'+FC[hi%3]+'">'+h.name.charAt(0)+'</span><span class="nm">'+h.name+'</span><span class="ct">'+h.b.length+' 个机器人</span></div>';
    h.b.forEach(function(x){
      var r=document.createElement('div');r.className='row';
      r.innerHTML='<span class="dot '+(x[2]==='on'?'on':'')+'"></span><span>'+x[0]+'</span><span class="ch">'+x[1]+'</span>';
      r.setAttribute('draggable','true');
      r.addEventListener('dragstart',function(ev){drag={x:x,from:hi};r.classList.add('drag');setTimeout(function(){r.style.display='none';},0);ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',x[0]);}catch(e){}});
      r.addEventListener('dragstart',function(){
        var ph=document.createElement('div');ph.className='row ph';ph.textContent=x[0];
        try{ r.parentNode.insertBefore(ph,r.nextSibling); r._ph=ph; }catch(e){}
      });
      r.addEventListener('dragend',function(){r.classList.remove('drag');r.style.display='';try{ if(r._ph){r._ph.remove();r._ph=null;} }catch(e){}clear();});
      card.appendChild(r);
    });
    card.addEventListener('dragover',function(ev){if(!drag)return;ev.preventDefault();clear();card.classList.add('over');});
    card.addEventListener('drop',function(ev){
      if(!drag)return;ev.preventDefault();clear();var d=drag;drag=null;
      if(d.from===hi){say('它已经在'+homes[hi].name+'家了');return;}
      homes[d.from].b.splice(homes[d.from].b.indexOf(d.x),1);homes[hi].b.push(d.x);render();
      say('“'+d.x[0]+'”搬到了'+homes[hi].name+'家');
    });
    g.appendChild(card);
  });
}
function clear(){document.querySelectorAll('.home.over').forEach(function(n){n.classList.remove('over');});}
function say(t){document.getElementById('msg').textContent=t;}
render();
</script>
</body>
</html>
