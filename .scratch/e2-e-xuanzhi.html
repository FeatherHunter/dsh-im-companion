<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向E · 宣纸拼图（B骨+A肉+C魂）</title>
<style>
body{margin:0;background:#f1ece1;color:#2e2620;font-family:"Songti SC","STSong","PingFang SC",serif;}
.wrap{max-width:880px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:15px;margin:0 0 4px;font-family:-apple-system,"PingFang SC",sans-serif;} .sub{font-size:12px;opacity:.6;margin:0 0 22px;font-family:-apple-system,"PingFang SC",sans-serif;}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.home{background:#fffdf6;border:1px solid #ddd2b4;border-radius:6px;padding:16px 16px 12px;box-shadow:0 3px 14px rgba(120,100,60,.08);}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.seal{background:#c8402a;color:#fff;font-size:15px;font-weight:800;border-radius:5px;padding:3px 7px;}
.nm{font-size:18px;font-weight:800;} .ct{margin-left:auto;font-size:11px;opacity:.55;font-family:-apple-system,"PingFang SC",sans-serif;}
.row{display:flex;align-items:center;gap:9px;margin-top:8px;padding:10px 12px;font-size:14px;cursor:grab;background:#f8f2e4;border:1px solid #e2d7b8;border-radius:8px;transition:transform .13s ease,box-shadow .13s ease;}
.row:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(120,100,60,.18);}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:#cfc8b4;}
.dot.on{background:#2e7d32;} .ch{margin-left:auto;font-size:11px;opacity:.55;font-family:-apple-system,"PingFang SC",sans-serif;}
.row.drag{opacity:.5;}
.row.ph{opacity:.4;transform:rotate(-3.5deg);border-style:dashed;pointer-events:none;}
.home.over{outline:2px solid #c8402a;outline-offset:4px;}
.hint{font-size:11px;opacity:.55;margin-top:14px;font-family:-apple-system,"PingFang SC",sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <h1>方向E · 宣纸拼图 <span style="font-weight:400;opacity:.6;">—— 融合款：B的骨 + A的暖 + C的影子</span></h1>
  <p class="sub">拖起一张帖，原位留一张歪斜的影子；悬停上浮。问题：稳不稳？暖不暖？</p>
  <div class="grid" id="grid"></div>
  <p class="hint" id="msg">拖“群管家”去阿梨家，看原位的影子。</p>
</div>
<script>
var homes=[
 {name:'小帅2',b:[['客服小冰','飞书','on'],['群管家','微信','on']]},
 {name:'阿梨',b:[['夜间值班','QQ','warn']]},
 {name:'老墨',b:[['商务一号','飞书','on'],['朋友圈号','微信','off'],['老客户群','QQ','on']]},
];
var drag=null;
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  homes.forEach(function(h,hi){
    var card=document.createElement('div');card.className='home';
    card.innerHTML='<div class="hd"><span class="seal">'+h.name.charAt(0)+'</span><span class="nm">'+h.name+'</span><span class="ct">'+h.b.length+' 个机器人</span></div>';
    h.b.forEach(function(x){
      var r=document.createElement('div');r.className='row';
      r.innerHTML='<span class="dot '+(x[2]==='on'?'on':'')+'"></span><span>'+x[0]+'</span><span class="ch">'+x[1]+'</span>';
      r.setAttribute('draggable','true');
      r.addEventListener('dragstart',function(ev){drag={x:x,from:hi};r.classList.add('drag');setTimeout(function(){r.style.display='none';},0);ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',x[0]);}catch(e){}});
      r.addEventListener('dragstart',function(){
        var ph=document.createElement('div');ph.className='row ph';ph.textContent=x[0];
        try{ r.parentNode.insertBefore(ph,r.nextSibling); r._ph=ph; }catch(e){}
      });
      r.addEventListener('dragend',function(){r.classList.remove('drag');r.style.display='';try{ if(r._ph){r._ph.remove();r._ph=null;} }catch(e){}clear();});
      card.appendChild(r);
    });
    card.addEventListener('dragover',function(ev){if(!drag)return;ev.preventDefault();clear();card.classList.add('over');});
    card.addEventListener('drop',function(ev){
      if(!drag)return;ev.preventDefault();clear();var d=drag;drag=null;
      if(d.from===hi){say('它已经在'+homes[hi].name+'家了');return;}
      homes[d.from].b.splice(homes[d.from].b.indexOf(d.x),1);homes[hi].b.push(d.x);render();
      say('“'+d.x[0]+'”搬到了'+homes[hi].name+'家');
    });
    g.appendChild(card);
  });
}
function clear(){document.querySelectorAll('.home.over').forEach(function(n){n.classList.remove('over');});}
function say(t){document.getElementById('msg').textContent=t;}
render();
</script>
</body>
</html>
